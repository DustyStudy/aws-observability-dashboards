AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Org-wide EKS security dashboard. Deploy this ONCE, in your central
  monitoring account (the one holding the OAM sink, see
  ../../org-observability/oam-sink), after every member account has both an
  OAM Link (../../org-observability/oam-link) and the EKS security collector
  (collector.yaml in this folder) deployed via StackSets. It contains no
  scanning logic; it only builds a cross-account dashboard that reads what
  each collector already publishes locally.

  CloudFormation can't loop-generate JSON inside a DashboardBody string, so a
  small Lambda-backed custom resource renders the dashboard from the member
  account IDs. Metric widgets sum each count across accounts; the GuardDuty
  and Inspector Logs Insights panels take a single accountId, so each member
  account gets its own pair of panels.

Parameters:
  DashboardName:
    Type: String
    Default: eks-security-org-dashboard
    Description: >-
      Name of the cross-account CloudWatch dashboard; also the prefix for the
      generator Lambda's resource names. Keep this different from the
      DashboardName used for the per-account collector stacks.
    AllowedPattern: "^[a-z0-9-]{1,40}$"

  MemberAccountIds:
    Type: CommaDelimitedList
    Description: >-
      Every member account ID whose EKS security collector metrics and finding
      logs should appear on this dashboard (the same accounts you deployed
      collector.yaml and the OAM Link to). Does not need to include the
      monitoring account itself unless it also runs its own collector. Each
      account adds two log widgets, so at most 246 accounts fit on one
      dashboard (500-widget limit); split larger orgs across several stacks.

  MetricNamespace:
    Type: String
    Default: EKS/Security
    Description: >-
      Namespace the collector publishes to. The collector hard-codes
      EKS/Security (in the Lambda source and in its IAM cloudwatch:namespace
      condition) and exposes no parameter for it, so leave the default unless
      you have forked the collector.

  CollectorDashboardName:
    Type: String
    Default: eks-security-dashboard
    Description: >-
      The DashboardName the collector stack was deployed with in the member
      accounts. The collector derives its GuardDuty and Inspector log group
      names from it (/aws/events/<name>/guardduty-eks and
      /aws/events/<name>/inspector-images), and this dashboard queries those
      log groups. Must be the same in every member account.
    AllowedPattern: "^[a-z0-9-]{1,40}$"

  LogRetentionDays:
    Type: Number
    Default: 365
    Description: Retention for the dashboard-generator Lambda's own log group.
    AllowedValues:
      [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]

Resources:
  # ---------------------------------------------------------------------
  # KMS key encrypting the generator Lambda's log group
  # ---------------------------------------------------------------------
  DashboardGeneratorKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Encrypts the ${DashboardName} generator Lambda's log group"
      EnableKeyRotation: true
      KeyPolicy: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "AllowAccountKeyAdministration",
              "Effect": "Allow",
              "Principal": { "AWS": "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" },
              "Action": "kms:*",
              "Resource": "*"
            },
            {
              "Sid": "AllowCloudWatchLogsToUseKey",
              "Effect": "Allow",
              "Principal": { "Service": "logs.${AWS::Region}.amazonaws.com" },
              "Action": [
                "kms:Encrypt*", "kms:Decrypt*", "kms:ReEncrypt*",
                "kms:GenerateDataKey*", "kms:Describe*"
              ],
              "Resource": "*",
              "Condition": {
                "ArnLike": {
                  "kms:EncryptionContext:aws:logs:arn": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"
                }
              }
            },
            {
              "Sid": "AllowLambdaAndSqsServices",
              "Effect": "Allow",
              "Principal": {
                "Service": ["lambda.amazonaws.com", "sqs.amazonaws.com"]
              },
              "Action": [
                "kms:Encrypt*", "kms:Decrypt*", "kms:ReEncrypt*",
                "kms:GenerateDataKey*", "kms:Describe*"
              ],
              "Resource": "*"
            }
          ]
        }

  DashboardGeneratorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${DashboardName}-generator"
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !GetAtt DashboardGeneratorKmsKey.Arn

  DashboardGeneratorDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${DashboardName}-generator-dlq"
      MessageRetentionPeriod: 1209600 # 14 days
      KmsMasterKeyId: !Ref DashboardGeneratorKmsKey

  # ---------------------------------------------------------------------
  # IAM role for the generator Lambda — only touches the one dashboard it owns
  # ---------------------------------------------------------------------
  DashboardGeneratorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${DashboardName}-generator-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: manage-this-dashboard-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutDashboard
                  - cloudwatch:DeleteDashboards
                  - cloudwatch:GetDashboard
                Resource: !Sub "arn:${AWS::Partition}:cloudwatch::${AWS::AccountId}:dashboard/${DashboardName}"
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt DashboardGeneratorDlq.Arn

  # ---------------------------------------------------------------------
  # Generator Lambda — renders and applies the DashboardBody at deploy time
  # ---------------------------------------------------------------------
  DashboardGeneratorFunction:
    Type: AWS::Lambda::Function
    DependsOn: DashboardGeneratorLogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_117
            comment: >-
              CloudFormation custom-resource Lambda that only calls the
              regional CloudWatch control-plane API at deploy time; a VPC
              would add nothing but a NAT gateway bill.
          - id: CKV_AWS_272
            comment: >-
              No AWS Signer code-signing pipeline exists for this account;
              out of scope for a public template repo since the profile ARN
              is account-specific.
    Properties:
      FunctionName: !Sub "${DashboardName}-generator"
      Description: CloudFormation custom-resource handler that builds and applies the org-wide EKS security dashboard's DashboardBody.
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt DashboardGeneratorRole.Arn
      ReservedConcurrentExecutions: 1
      KmsKeyArn: !GetAtt DashboardGeneratorKmsKey.Arn
      DeadLetterConfig:
        TargetArn: !GetAtt DashboardGeneratorDlq.Arn
      TracingConfig:
        Mode: Active
      Code:
        ZipFile: |
          import json
          import re
          import urllib.request

          import boto3
          from botocore.exceptions import ClientError

          cloudwatch = boto3.client("cloudwatch")

          # A dashboard holds at most 500 widgets; this dashboard uses
          # FIXED_WIDGETS (header, 6 metric widgets, log-section note) plus
          # 2 log widgets (GuardDuty + Inspector) per member account.
          MAX_WIDGETS = 500
          FIXED_WIDGETS = 8
          LOG_WIDGETS_PER_ACCOUNT = 2
          MAX_ACCOUNTS = (MAX_WIDGETS - FIXED_WIDGETS) // LOG_WIDGETS_PER_ACCOUNT

          ACCOUNT_ID_RE = re.compile(r"^[0-9]{12}$")


          def send_cfn_response(event, context, status, data=None, physical_resource_id=None, reason=None):
              body = json.dumps({
                  "Status": status,
                  "Reason": reason or f"See CloudWatch Logs: {context.log_stream_name}",
                  "PhysicalResourceId": physical_resource_id or event.get("PhysicalResourceId") or event["LogicalResourceId"],
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "NoEcho": False,
                  "Data": data or {},
              }).encode("utf-8")
              req = urllib.request.Request(
                  event["ResponseURL"], data=body, method="PUT",
                  headers={"Content-Type": "", "Content-Length": str(len(body))},
              )
              urllib.request.urlopen(req)


          # ---------------------------------------------------------------
          # Metric widgets. Every count the collector publishes un-dimensioned
          # is summed across every linked member account via a hidden
          # per-account metric entry (each carrying its own "accountId")
          # plus one visible SUM() expression — the general recipe for "org
          # rollup" widgets. See ../../org-observability/README.md.
          # Each widget below shows exactly one group, so the per-widget
          # metric ids only need distinct prefixes between widgets to stay
          # readable; they are also unique within each widget.
          # ---------------------------------------------------------------
          def _sum_across_accounts(namespace, metric_name, account_ids, label, stat="Maximum", period=86400, id_prefix="m"):
              entries = []
              ids = []
              for i, acct in enumerate(account_ids):
                  mid = f"{id_prefix}{i}"
                  ids.append(mid)
                  entries.append([namespace, metric_name, {
                      "stat": stat, "period": period, "accountId": acct,
                      "id": mid, "visible": False,
                  }])
              entries.append([{
                  "expression": f"SUM([{','.join(ids)}])",
                  "label": label,
                  "id": f"total_{id_prefix}",
              }])
              return entries


          def _metric_widget(x, y, w, h, title, view, namespace, metric_name, account_ids, region, stat, id_prefix):
              return {
                  "type": "metric", "x": x, "y": y, "width": w, "height": h,
                  "properties": {
                      "title": title, "view": view, "region": region,
                      "metrics": _sum_across_accounts(
                          namespace, metric_name, account_ids, title, stat=stat, id_prefix=id_prefix),
                  },
              }


          # ---------------------------------------------------------------
          # Log widgets. A Logs Insights widget takes ONE accountId, so it
          # cannot collapse across accounts the way metrics can: emit one
          # widget per member account per log panel instead.
          # ---------------------------------------------------------------
          def _log_widget(x, y, w, h, title, account_id, region, query):
              return {
                  "type": "log", "x": x, "y": y, "width": w, "height": h,
                  "properties": {
                      "title": f"{title} - {account_id}", "view": "table",
                      "region": region, "accountId": account_id, "query": query,
                  },
              }


          def _normalize_account_ids(account_ids):
              cleaned = [str(a).strip() for a in account_ids if str(a).strip()]
              if not cleaned:
                  raise ValueError("MemberAccountIds must contain at least one account ID")
              bad = [a for a in cleaned if not ACCOUNT_ID_RE.match(a)]
              if bad:
                  raise ValueError(f"MemberAccountIds must be 12-digit account IDs, got: {bad}")
              if len(cleaned) > MAX_ACCOUNTS:
                  raise ValueError(
                      f"{len(cleaned)} accounts would need more than {MAX_WIDGETS} dashboard widgets "
                      f"(2 log widgets per account, max {MAX_ACCOUNTS} accounts); split the accounts "
                      "across several org-dashboard stacks with different DashboardName values"
                  )
              return cleaned


          def build_dashboard_body(namespace, collector_name, account_ids, region):
              account_ids = _normalize_account_ids(account_ids)
              guardduty_log_group = f"/aws/events/{collector_name}/guardduty-eks"
              inspector_log_group = f"/aws/events/{collector_name}/inspector-images"
              guardduty_query = (
                  f"SOURCE '{guardduty_log_group}' | fields @timestamp, detail.type, detail.severity, "
                  "detail.resource.eksClusterDetails.name, detail.title | sort @timestamp desc | limit 50"
              )
              inspector_query = (
                  f"SOURCE '{inspector_log_group}' | fields @timestamp, detail.severity, detail.title, "
                  "detail.resources.0.details.awsEcrContainerImage.repositoryName | sort @timestamp desc | limit 50"
              )

              widgets = [
                  {"type": "text", "x": 0, "y": 0, "width": 24, "height": 2, "properties": {
                      "markdown": (
                          "## EKS Security Dashboard (org-wide)\n"
                          "GuardDuty EKS Protection findings, Inspector container image vulnerabilities, and "
                          f"Kubernetes version/AMI patch drift across all clusters and nodegroups in {len(account_ids)} "
                          "member account(s). Counts are summed across accounts; finding logs are shown per account."
                      ),
                  }},
                  _metric_widget(0, 2, 8, 6, "Clusters with Version Drift (org-wide)", "timeSeries", namespace,
                                 "ClusterVersionDriftCount", account_ids, region, "Maximum", "vd"),
                  _metric_widget(8, 2, 8, 6, "Nodegroups Needing Version Update (org-wide)", "timeSeries", namespace,
                                 "NodegroupsNeedingUpdate", account_ids, region, "Maximum", "nu"),
                  _metric_widget(16, 2, 8, 6, "Nodegroups with Stale AMI (org-wide)", "timeSeries", namespace,
                                 "StaleAmiNodegroups", account_ids, region, "Maximum", "sa"),
                  _metric_widget(0, 8, 8, 6, "Nodegroup Health Issues (org-wide)", "timeSeries", namespace,
                                 "NodegroupHealthIssues", account_ids, region, "Sum", "hi"),
                  _metric_widget(8, 8, 8, 6, "Clusters with Public-Only API Endpoint (org-wide)", "timeSeries", namespace,
                                 "PublicOnlyEndpointClusters", account_ids, region, "Maximum", "po"),
                  _metric_widget(16, 8, 8, 6, "Clusters Scanned (org-wide, last run)", "singleValue", namespace,
                                 "ClustersScanned", account_ids, region, "Maximum", "cs"),
                  {"type": "text", "x": 0, "y": 14, "width": 24, "height": 2, "properties": {
                      "markdown": (
                          "### Findings by member account\n"
                          "A Logs Insights widget can only query one account, so each member account has its own "
                          "GuardDuty (left) and Inspector (right) panel."
                      ),
                  }},
              ]

              # One row per account: GuardDuty on the left, Inspector on the right.
              for i, acct in enumerate(account_ids):
                  y = 16 + 8 * i
                  widgets.append(_log_widget(0, y, 12, 8, "GuardDuty - EKS / Container Findings", acct, region, guardduty_query))
                  widgets.append(_log_widget(12, y, 12, 8, "Inspector - Critical/High Image Findings", acct, region, inspector_query))

              if len(widgets) > MAX_WIDGETS:
                  raise ValueError(f"dashboard would have {len(widgets)} widgets (max {MAX_WIDGETS})")
              return {"widgets": widgets}


          def handler(event, context):
              request_type = event["RequestType"]
              props = event.get("ResourceProperties", {})
              dashboard_name = props["DashboardName"]

              try:
                  if request_type in ("Create", "Update"):
                      namespace = props.get("MetricNamespace", "EKS/Security")
                      collector_name = props.get("CollectorDashboardName", "eks-security-dashboard")
                      account_ids = props["MemberAccountIds"]
                      if isinstance(account_ids, str):
                          account_ids = [a.strip() for a in account_ids.split(",") if a.strip()]
                      region = props.get("Region") or context.invoked_function_arn.split(":")[3]

                      body = build_dashboard_body(namespace, collector_name, account_ids, region)
                      cloudwatch.put_dashboard(DashboardName=dashboard_name, DashboardBody=json.dumps(body))
                      send_cfn_response(event, context, "SUCCESS", physical_resource_id=dashboard_name)

                  elif request_type == "Delete":
                      physical_id = event.get("PhysicalResourceId", dashboard_name)
                      try:
                          cloudwatch.delete_dashboards(DashboardNames=[physical_id])
                      except ClientError as exc:
                          if exc.response["Error"]["Code"] not in ("ResourceNotFound", "ResourceNotFoundException"):
                              raise
                      send_cfn_response(event, context, "SUCCESS", physical_resource_id=physical_id)

                  else:
                      send_cfn_response(event, context, "SUCCESS", physical_resource_id=dashboard_name)

              except Exception as exc:
                  print(f"ERROR: {exc}")
                  send_cfn_response(event, context, "FAILED", reason=str(exc),
                                     physical_resource_id=event.get("PhysicalResourceId", dashboard_name))

  # ---------------------------------------------------------------------
  # The custom resource that actually triggers the Lambda above
  # ---------------------------------------------------------------------
  OrgDashboard:
    Type: Custom::EksSecurityOrgDashboard
    Properties:
      ServiceToken: !GetAtt DashboardGeneratorFunction.Arn
      DashboardName: !Ref DashboardName
      MemberAccountIds: !Join [",", !Ref MemberAccountIds]
      MetricNamespace: !Ref MetricNamespace
      CollectorDashboardName: !Ref CollectorDashboardName
      Region: !Ref "AWS::Region"

Outputs:
  DashboardUrl:
    Description: Console URL to open the cross-account dashboard directly
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${DashboardName}"
