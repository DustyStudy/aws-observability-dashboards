AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Org-wide AI service inventory dashboard (shadow-AI adoption tracking:
  which regions in which accounts use which AI services). Deploy this ONCE,
  in your central monitoring account (the one holding the OAM sink — see
  ../../org-observability/oam-sink), after every member account has an OAM
  Link (../../org-observability/oam-link) and the collector (collector.yaml
  in this folder) deployed via StackSets. It contains no scanning logic — it
  only builds a cross-account dashboard over the ServiceActive metrics each
  collector publishes locally.

  CloudFormation can't loop-generate JSON inside a DashboardBody string, so
  a small Lambda-backed custom resource renders the dashboard from the
  member account IDs at deploy time. The Terraform version
  (terraform/ai-service-inventory-dashboard/org-dashboard) uses a native
  `for` expression instead.

Parameters:
  DashboardName:
    Type: String
    Default: ai-service-inventory-org-dashboard
    Description: Name of the cross-account CloudWatch dashboard.

  MemberAccountIds:
    Type: CommaDelimitedList
    Default: ""
    Description: >-
      Leave empty (the default) to show every account linked to this
      monitoring account, using CloudWatch Metrics Insights queries that
      group by account. Or list specific 12-digit account IDs to show only
      those, one metric per account (limited to roughly 500/(series+1)
      accounts per widget).

  MetricNamespace:
    Type: String
    Default: AIServiceInventory
    Description: Must match the MetricNamespace parameter used when deploying collector.yaml in every member account.

  LogRetentionDays:
    Type: Number
    Default: 365
    Description: Retention for the dashboard-generator Lambda's own log group.
    AllowedValues:
      [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]

Resources:
  # ---------------------------------------------------------------------
  # KMS key encrypting the generator Lambda's log group
  # ---------------------------------------------------------------------
  DashboardGeneratorKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Encrypts the ${DashboardName} generator Lambda's log group"
      EnableKeyRotation: true
      KeyPolicy: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "AllowAccountKeyAdministration",
              "Effect": "Allow",
              "Principal": { "AWS": "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" },
              "Action": "kms:*",
              "Resource": "*"
            },
            {
              "Sid": "AllowCloudWatchLogsToUseKey",
              "Effect": "Allow",
              "Principal": { "Service": "logs.${AWS::Region}.amazonaws.com" },
              "Action": [
                "kms:Encrypt*", "kms:Decrypt*", "kms:ReEncrypt*",
                "kms:GenerateDataKey*", "kms:Describe*"
              ],
              "Resource": "*",
              "Condition": {
                "ArnLike": {
                  "kms:EncryptionContext:aws:logs:arn": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"
                }
              }
            },
            {
              "Sid": "AllowLambdaAndSqsServices",
              "Effect": "Allow",
              "Principal": {
                "Service": ["lambda.amazonaws.com", "sqs.amazonaws.com"]
              },
              "Action": [
                "kms:Encrypt*", "kms:Decrypt*", "kms:ReEncrypt*",
                "kms:GenerateDataKey*", "kms:Describe*"
              ],
              "Resource": "*"
            }
          ]
        }

  DashboardGeneratorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${DashboardName}-generator"
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !GetAtt DashboardGeneratorKmsKey.Arn

  DashboardGeneratorDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${DashboardName}-generator-dlq"
      MessageRetentionPeriod: 1209600 # 14 days
      KmsMasterKeyId: !Ref DashboardGeneratorKmsKey

  # ---------------------------------------------------------------------
  # IAM role for the generator Lambda — only touches the one dashboard it owns
  # ---------------------------------------------------------------------
  DashboardGeneratorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${DashboardName}-generator-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: manage-this-dashboard-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutDashboard
                  - cloudwatch:DeleteDashboards
                  - cloudwatch:GetDashboard
                Resource: !Sub "arn:${AWS::Partition}:cloudwatch::${AWS::AccountId}:dashboard/${DashboardName}"
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt DashboardGeneratorDlq.Arn

  # ---------------------------------------------------------------------
  # Generator Lambda — renders and applies the DashboardBody at deploy time
  # ---------------------------------------------------------------------
  DashboardGeneratorFunction:
    Type: AWS::Lambda::Function
    DependsOn: DashboardGeneratorLogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_117
            comment: >-
              CloudFormation custom-resource Lambda that only calls the
              regional CloudWatch control-plane API at deploy time; a VPC
              would add nothing but a NAT gateway bill.
          - id: CKV_AWS_272
            comment: >-
              No AWS Signer code-signing pipeline exists for this account;
              out of scope for a public template repo since the profile ARN
              is account-specific.
    Properties:
      FunctionName: !Sub "${DashboardName}-generator"
      Description: CloudFormation custom-resource handler that builds and applies the org-wide AI service inventory dashboard's DashboardBody.
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt DashboardGeneratorRole.Arn
      ReservedConcurrentExecutions: 1
      KmsKeyArn: !GetAtt DashboardGeneratorKmsKey.Arn
      DeadLetterConfig:
        TargetArn: !GetAtt DashboardGeneratorDlq.Arn
      TracingConfig:
        Mode: Active
      Code:
        ZipFile: |
          import json
          import re
          import urllib.request

          import boto3
          from botocore.exceptions import ClientError

          cloudwatch = boto3.client("cloudwatch")


          def send_cfn_response(event, context, status, data=None, physical_resource_id=None, reason=None):
              body = json.dumps({
                  "Status": status,
                  "Reason": reason or f"See CloudWatch Logs: {context.log_stream_name}",
                  "PhysicalResourceId": physical_resource_id or event.get("PhysicalResourceId") or event["LogicalResourceId"],
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "NoEcho": False,
                  "Data": data or {},
              }).encode("utf-8")
              req = urllib.request.Request(
                  event["ResponseURL"], data=body, method="PUT",
                  headers={"Content-Type": "", "Content-Length": str(len(body))},
              )
              urllib.request.urlopen(req)


          # ---------------------------------------------------------------
          # The collector publishes one 1/0 "ServiceActive" metric per
          # Service x Region in every account. Widgets here either keep
          # per-account x per-region visibility (one visible SEARCH per
          # account, labelled "<account> - <region>") or roll the counts up
          # org-wide (hidden per-account entries, each carrying its own
          # "accountId", plus one visible SUM() expression). The schema is
          # always {namespace,Service,Region}: the collector's metrics carry
          # both dimensions, so a Region-only schema would match nothing.
          #
          # With no account IDs (all-accounts mode) each widget is instead
          # one CloudWatch Metrics Insights query over every account linked
          # to this monitoring account, e.g.
          # SELECT SUM(ServiceActive) FROM SCHEMA("<ns>", Service, Region)
          # GROUP BY Service, so there is no per-widget account ceiling.
          # ---------------------------------------------------------------

          # (Service dimension value, display title, metric-math id prefix)
          SERVICES = [
              ("Bedrock", "Bedrock", "bd"),
              ("BedrockAgents", "Bedrock Agents", "ba"),
              ("BedrockGuardrails", "Bedrock Guardrails", "bg"),
              ("Rekognition", "Rekognition", "rk"),
              ("Comprehend", "Comprehend", "cp"),
              ("Textract", "Textract", "tx"),
          ]


          def _active_search(namespace, service=None):
              schema = f"{{{namespace},Service,Region}} MetricName=\"ServiceActive\""
              if service:
                  schema += f" Service=\"{service}\""
              return f"SEARCH('{schema}', 'Maximum', 86400)"


          def _insights(namespace, where="", tail=""):
              # Metrics Insights query over the ServiceActive metric; SCHEMA
              # must list the metric's exact dimension set (Service, Region).
              return (
                  f'SELECT SUM(ServiceActive) FROM SCHEMA("{namespace}", Service, Region)'
                  f"{where}{tail}"
              )


          def _sum_across_accounts(namespace, account_ids, label, service=None, id_prefix="m"):
              if not account_ids:
                  # All-accounts mode: one query summing over every linked
                  # account (and, without a service, every service/region).
                  where = f" WHERE Service = '{service}'" if service else ""
                  return [[{
                      "expression": _insights(namespace, where=where),
                      "label": label,
                      "id": f"total_{id_prefix}",
                      "period": 86400,
                  }]]
              # Hidden per-account "active regions" count + one visible SUM().
              entries = []
              ids = []
              for i, acct in enumerate(account_ids):
                  mid = f"{id_prefix}{i}"
                  ids.append(mid)
                  entries.append([{
                      "expression": f"SUM({_active_search(namespace, service)})",
                      "id": mid, "accountId": acct, "visible": False,
                  }])
              entries.append([{
                  "expression": f"SUM([{','.join(ids)}])",
                  "label": label,
                  "id": f"total_{id_prefix}",
              }])
              return entries


          def _pairs_total_widget(x, y, w, h, namespace, account_ids, region):
              return {
                  "type": "metric", "x": x, "y": y, "width": w, "height": h,
                  "properties": {
                      "title": "Active AI Service/Region Pairs (org-wide, 6 watched services)",
                      "view": "singleValue", "region": region,
                      "metrics": _sum_across_accounts(
                          namespace, account_ids, "Active service/region pairs (org-wide)", id_prefix="ap"),
                  },
              }


          def _service_totals_widget(x, y, w, h, namespace, account_ids, region):
              # One group per service; distinct id prefixes keep the six
              # N-account groups from colliding inside this one widget.
              if not account_ids:
                  # All-accounts mode: one series per Service value (the
                  # collector publishes exactly the services above).
                  metrics = [[{
                      "expression": _insights(namespace, tail=" GROUP BY Service"),
                      "id": "svc_all", "period": 86400,
                  }]]
              else:
                  metrics = []
                  for service, title, prefix in SERVICES:
                      metrics.extend(_sum_across_accounts(namespace, account_ids, title, service=service, id_prefix=prefix))
              return {
                  "type": "metric", "x": x, "y": y, "width": w, "height": h,
                  "properties": {
                      "title": "Active Regions per AI Service (org-wide, account/region pairs)",
                      "view": "bar", "region": region, "metrics": metrics,
                  },
              }


          def _pairs_by_account_widget(x, y, w, h, namespace, account_ids, region):
              metrics = []
              if not account_ids:
                  # All-accounts mode: one series per account, largest first.
                  # Metrics Insights returns at most 500 series per query and
                  # a bar chart of that many accounts is unreadable, so keep
                  # the 100 accounts with the most active service/region
                  # pairs. The org-wide totals are not affected by this limit.
                  metrics.append([{
                      "expression": _insights(namespace, tail=" GROUP BY AWS.AccountId ORDER BY SUM() DESC LIMIT 100"),
                      "id": "ac_all", "period": 86400,
                  }])
              for i, acct in enumerate(account_ids):
                  metrics.append([{
                      "expression": f"SUM({_active_search(namespace)})",
                      "id": f"ac{i}", "accountId": acct, "label": acct,
                  }])
              return {
                  "type": "metric", "x": x, "y": y, "width": w, "height": h,
                  "properties": {
                      "title": "Active AI Services by Account (active service/region pairs per account)",
                      "view": "bar", "region": region, "metrics": metrics,
                  },
              }


          def _service_region_widget(x, y, w, h, namespace, service, title, prefix, account_ids, region):
              # One SEARCH per account: which regions in which accounts use
              # this service.
              metrics = []
              if not account_ids:
                  # All-accounts mode: one series per region holding the
                  # number of accounts using the service there. Grouping by
                  # Region only keeps the query far below the 500-series
                  # limit; the per-account view is the "by Account" widget.
                  metrics.append([{
                      "expression": _insights(namespace, where=f" WHERE Service = '{service}'", tail=" GROUP BY Region"),
                      "id": f"{prefix}_all", "period": 86400,
                  }])
                  title = f"{title} \u2014 Accounts Using It, by Region"
              else:
                  title = f"{title} \u2014 Active by Account/Region"
              for i, acct in enumerate(account_ids):
                  metrics.append([{
                      "expression": _active_search(namespace, service),
                      "id": f"{prefix}{i}", "accountId": acct,
                      "label": acct + " - ${PROP('Dim.Region')}",
                  }])
              return {
                  "type": "metric", "x": x, "y": y, "width": w, "height": h,
                  "properties": {
                      "title": title,
                      "view": "bar", "region": region, "metrics": metrics,
                  },
              }


          def build_dashboard_body(namespace, account_ids, region):
              widgets = [
                  _pairs_total_widget(0, 0, 6, 6, namespace, account_ids, region),
                  _service_totals_widget(6, 0, 18, 6, namespace, account_ids, region),
                  _pairs_by_account_widget(0, 6, 24, 6, namespace, account_ids, region),
              ]
              # Six per-service widgets in a 2-column grid (y = 12, 18, 24).
              for idx, (service, title, prefix) in enumerate(SERVICES):
                  widgets.append(_service_region_widget(
                      (idx % 2) * 12, 12 + (idx // 2) * 6, 12, 6,
                      namespace, service, title, prefix, account_ids, region))
              return {"widgets": widgets}


          def handler(event, context):
              request_type = event["RequestType"]
              props = event.get("ResourceProperties", {})
              dashboard_name = props["DashboardName"]

              try:
                  if request_type in ("Create", "Update"):
                      namespace = props.get("MetricNamespace", "AIServiceInventory")
                      account_ids = props.get("MemberAccountIds", [])
                      if isinstance(account_ids, str):
                          account_ids = [a.strip() for a in account_ids.split(",") if a.strip()]
                      account_ids = [a for a in account_ids if a]
                      if not re.fullmatch(r"[A-Za-z0-9_./-]+", namespace):
                          raise ValueError("MetricNamespace may only contain letters, numbers, underscores, dots, slashes, and hyphens")
                      for a in account_ids:
                          if not re.fullmatch(r"[0-9]{12}", a):
                              raise ValueError(f"Invalid account ID: {a!r}")
                      region = props.get("Region") or context.invoked_function_arn.split(":")[3]

                      body = build_dashboard_body(namespace, account_ids, region)
                      cloudwatch.put_dashboard(DashboardName=dashboard_name, DashboardBody=json.dumps(body))
                      send_cfn_response(event, context, "SUCCESS", physical_resource_id=dashboard_name)

                  elif request_type == "Delete":
                      physical_id = event.get("PhysicalResourceId", dashboard_name)
                      try:
                          cloudwatch.delete_dashboards(DashboardNames=[physical_id])
                      except ClientError as exc:
                          if exc.response["Error"]["Code"] not in ("ResourceNotFound", "ResourceNotFoundException"):
                              raise
                      send_cfn_response(event, context, "SUCCESS", physical_resource_id=physical_id)

                  else:
                      send_cfn_response(event, context, "SUCCESS", physical_resource_id=dashboard_name)

              except Exception as exc:
                  print(f"ERROR: {exc}")
                  send_cfn_response(event, context, "FAILED", reason=str(exc),
                                     physical_resource_id=event.get("PhysicalResourceId", dashboard_name))

  # ---------------------------------------------------------------------
  # The custom resource that actually triggers the Lambda above
  # ---------------------------------------------------------------------
  OrgDashboard:
    Type: Custom::AiServiceInventoryOrgDashboard
    Properties:
      ServiceToken: !GetAtt DashboardGeneratorFunction.Arn
      DashboardName: !Ref DashboardName
      MemberAccountIds: !Join [",", !Ref MemberAccountIds]
      MetricNamespace: !Ref MetricNamespace
      Region: !Ref "AWS::Region"

Outputs:
  DashboardUrl:
    Description: Console URL to open the cross-account dashboard directly
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${DashboardName}"
