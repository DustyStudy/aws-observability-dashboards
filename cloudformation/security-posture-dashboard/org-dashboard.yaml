AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Org-wide security posture dashboard. Deploy this ONCE, in your central
  monitoring account (the one holding the OAM sink), after every member
  account has an OAM Link and the security posture collector (collector.yaml
  in this folder) deployed via StackSets. Contains no scanning logic: it only
  builds a cross-account dashboard over the metrics and finding logs each
  collector publishes locally. Uses a Lambda-backed custom resource to render
  the DashboardBody, since CloudFormation can't loop-generate JSON (the
  Terraform version does this natively). Metrics are summed across accounts;
  log widgets take a single accountId, so each log panel is rendered once
  per member account.

Parameters:
  DashboardName:
    Type: String
    Default: security-posture-org-dashboard
    Description: Name of the cross-account CloudWatch dashboard.

  MemberAccountIds:
    Type: CommaDelimitedList
    Description: >-
      Every member account ID whose security-posture collector metrics and
      logs should appear on this dashboard (the same accounts you deployed
      collector.yaml and the OAM Link to). Does not need to include the
      monitoring account itself unless it also runs its own collector. Each
      account adds 5 log widgets and a dashboard holds at most 500 widgets,
      so at most 99 accounts fit on one dashboard.

  MetricNamespace:
    Type: String
    Default: SecurityObservability
    Description: Must match the MetricNamespace parameter used when deploying collector.yaml in every member account.

  NamePrefix:
    Type: String
    Default: security-posture
    Description: >-
      Must match the NamePrefix parameter used when deploying collector.yaml
      in every member account; it forms the collector's log group names
      (/observability/<NamePrefix>/security-hub-findings and
      /observability/<NamePrefix>/guardduty-findings) that the log widgets query.
    AllowedPattern: "^[a-z0-9-]{1,40}$"

  LogRetentionDays:
    Type: Number
    Default: 365
    Description: Retention for the dashboard-generator Lambda's own log group.
    AllowedValues:
      [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]

Resources:
  # ---------------------------------------------------------------------
  # KMS key encrypting the generator Lambda's log group
  # ---------------------------------------------------------------------
  DashboardGeneratorKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Encrypts the ${DashboardName} generator Lambda's log group"
      EnableKeyRotation: true
      KeyPolicy: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "AllowAccountKeyAdministration",
              "Effect": "Allow",
              "Principal": { "AWS": "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" },
              "Action": "kms:*",
              "Resource": "*"
            },
            {
              "Sid": "AllowCloudWatchLogsToUseKey",
              "Effect": "Allow",
              "Principal": { "Service": "logs.${AWS::Region}.amazonaws.com" },
              "Action": [
                "kms:Encrypt*", "kms:Decrypt*", "kms:ReEncrypt*",
                "kms:GenerateDataKey*", "kms:Describe*"
              ],
              "Resource": "*",
              "Condition": {
                "ArnLike": {
                  "kms:EncryptionContext:aws:logs:arn": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"
                }
              }
            },
            {
              "Sid": "AllowLambdaAndSqsServices",
              "Effect": "Allow",
              "Principal": {
                "Service": ["lambda.amazonaws.com", "sqs.amazonaws.com"]
              },
              "Action": [
                "kms:Encrypt*", "kms:Decrypt*", "kms:ReEncrypt*",
                "kms:GenerateDataKey*", "kms:Describe*"
              ],
              "Resource": "*"
            }
          ]
        }

  DashboardGeneratorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${DashboardName}-generator"
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !GetAtt DashboardGeneratorKmsKey.Arn

  DashboardGeneratorDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${DashboardName}-generator-dlq"
      MessageRetentionPeriod: 1209600 # 14 days
      KmsMasterKeyId: !Ref DashboardGeneratorKmsKey

  # ---------------------------------------------------------------------
  # IAM role for the generator Lambda — only touches the one dashboard it owns
  # ---------------------------------------------------------------------
  DashboardGeneratorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${DashboardName}-generator-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: manage-this-dashboard-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutDashboard
                  - cloudwatch:DeleteDashboards
                  - cloudwatch:GetDashboard
                Resource: !Sub "arn:${AWS::Partition}:cloudwatch::${AWS::AccountId}:dashboard/${DashboardName}"
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt DashboardGeneratorDlq.Arn

  # ---------------------------------------------------------------------
  # Generator Lambda — renders and applies the DashboardBody at deploy time
  # ---------------------------------------------------------------------
  DashboardGeneratorFunction:
    Type: AWS::Lambda::Function
    DependsOn: DashboardGeneratorLogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_117
            comment: >-
              CloudFormation custom-resource Lambda that only calls the
              regional CloudWatch control-plane API at deploy time; a VPC
              would add nothing but a NAT gateway bill.
          - id: CKV_AWS_272
            comment: >-
              No AWS Signer code-signing pipeline exists for this account;
              out of scope for a public template repo since the profile ARN
              is account-specific.
    Properties:
      FunctionName: !Sub "${DashboardName}-generator"
      Description: CloudFormation custom-resource handler that builds and applies the org-wide security posture dashboard's DashboardBody.
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt DashboardGeneratorRole.Arn
      ReservedConcurrentExecutions: 1
      KmsKeyArn: !GetAtt DashboardGeneratorKmsKey.Arn
      DeadLetterConfig:
        TargetArn: !GetAtt DashboardGeneratorDlq.Arn
      TracingConfig:
        Mode: Active
      Code:
        ZipFile: |
          import json
          import urllib.request

          import boto3
          from botocore.exceptions import ClientError

          cloudwatch = boto3.client("cloudwatch")

          # A CloudWatch dashboard holds at most 500 widgets.
          MAX_WIDGETS = 500


          def send_cfn_response(event, context, status, data=None, physical_resource_id=None, reason=None):
              body = json.dumps({
                  "Status": status,
                  "Reason": reason or f"See CloudWatch Logs: {context.log_stream_name}",
                  "PhysicalResourceId": physical_resource_id or event.get("PhysicalResourceId") or event["LogicalResourceId"],
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "NoEcho": False,
                  "Data": data or {},
              }).encode("utf-8")
              req = urllib.request.Request(
                  event["ResponseURL"], data=body, method="PUT",
                  headers={"Content-Type": "", "Content-Length": str(len(body))},
              )
              urllib.request.urlopen(req)


          # ---------------------------------------------------------------
          # Metric widgets. Every metric widget here sums the same
          # un-dimensioned count metric across every linked member account
          # via a hidden per-account metric entry plus one visible SUM()
          # expression — this is the general recipe for "org rollup"
          # widgets: replace a single-account metric entry with one entry
          # per account (each carrying its own "accountId"), then combine
          # with metric math. See ../../org-observability/README.md.
          # ---------------------------------------------------------------
          def _sum_across_accounts(namespace, metric_name, account_ids, label, stat="Sum", period=86400, id_prefix="m"):
              entries = []
              ids = []
              for i, acct in enumerate(account_ids):
                  mid = f"{id_prefix}{i}"
                  ids.append(mid)
                  entries.append([namespace, metric_name, {
                      "stat": stat, "period": period, "accountId": acct,
                      "id": mid, "visible": False,
                  }])
              entries.append([{
                  "expression": f"SUM([{','.join(ids)}])",
                  "label": label,
                  "id": f"total_{id_prefix}",
              }])
              return entries


          def _single_value_widget(x, y, w, h, title, namespace, metric_name, account_ids, region, id_prefix):
              return {
                  "type": "metric", "x": x, "y": y, "width": w, "height": h,
                  "properties": {
                      "title": title, "view": "singleValue", "region": region,
                      "metrics": _sum_across_accounts(namespace, metric_name, account_ids, title, id_prefix=id_prefix),
                  },
              }


          # ---------------------------------------------------------------
          # Log widgets. A CloudWatch log widget takes a single "accountId",
          # so Logs Insights panels cannot be collapsed across accounts the
          # way metrics can. Emit one widget per member account per panel,
          # each carrying that account's ID in its title and "accountId" in
          # its properties, laid out in a grid on the 24-column dashboard.
          # ---------------------------------------------------------------
          def _log_panels(name_prefix):
              sechub = f"/observability/{name_prefix}/security-hub-findings"
              guardduty = f"/observability/{name_prefix}/guardduty-findings"
              return [
                  {"title": "Security Hub Findings – Volume (24h)", "view": "bar", "width": 6, "height": 4,
                   "query": f"SOURCE '{sechub}' | fields @timestamp | stats count(*) as findings"},
                  {"title": "Security Hub Findings by Severity", "view": "pie", "width": 12, "height": 6,
                   "query": f"SOURCE '{sechub}' | fields detail.findings.0.Severity.Label as severity | stats count(*) as findings by severity | sort findings desc"},
                  {"title": "Top Failing Security Hub Controls", "view": "bar", "width": 12, "height": 6,
                   "query": f"SOURCE '{sechub}' | filter detail.findings.0.Compliance.Status = 'FAILED' | fields detail.findings.0.GeneratorId as control | stats count(*) as failures by control | sort failures desc | limit 10"},
                  {"title": "GuardDuty Findings by Type", "view": "bar", "width": 12, "height": 6,
                   "query": f"SOURCE '{guardduty}' | fields detail.type as findingType | stats count(*) as findings by findingType | sort findings desc | limit 10"},
                  {"title": "GuardDuty Findings Trend (hourly)", "view": "line", "width": 12, "height": 6,
                   "query": f"SOURCE '{guardduty}' | stats count(*) as findings by bin(1h)"},
              ]


          def _log_widgets(name_prefix, account_ids, region, start_y):
              widgets = []
              y = start_y
              for panel in _log_panels(name_prefix):
                  per_row = 24 // panel["width"]
                  for i, acct in enumerate(account_ids):
                      widgets.append({
                          "type": "log",
                          "x": (i % per_row) * panel["width"],
                          "y": y + (i // per_row) * panel["height"],
                          "width": panel["width"], "height": panel["height"],
                          "properties": {
                              "title": f"{panel['title']} – {acct}",
                              "accountId": acct,
                              "region": region,
                              "view": panel["view"],
                              "query": panel["query"],
                          },
                      })
                  rows = -(-len(account_ids) // per_row)  # ceil
                  y += rows * panel["height"]
              return widgets


          def build_dashboard_body(namespace, name_prefix, account_ids, region):
              if not account_ids:
                  raise ValueError("MemberAccountIds must contain at least one account ID")
              widgets = [
                  _single_value_widget(0, 0, 8, 4, "Security Hub – Critical (24h, org-wide)", namespace,
                                       "SecurityHubCriticalFindings", account_ids, region, "shc"),
                  _single_value_widget(8, 0, 8, 4, "Security Hub – High (24h, org-wide)", namespace,
                                       "SecurityHubHighFindings", account_ids, region, "shh"),
                  _single_value_widget(16, 0, 8, 4, "GuardDuty – High Severity (24h, org-wide)", namespace,
                                       "GuardDutyHighSeverityFindings", account_ids, region, "gdh"),
              ]
              widgets.extend(_log_widgets(name_prefix, account_ids, region, start_y=4))
              if len(widgets) > MAX_WIDGETS:
                  raise ValueError(
                      f"{len(widgets)} widgets exceeds the {MAX_WIDGETS}-widget dashboard limit "
                      f"(3 metric widgets + 5 log widgets per account); split MemberAccountIds "
                      f"across several org-dashboard stacks"
                  )
              return {"widgets": widgets}


          def handler(event, context):
              request_type = event["RequestType"]
              props = event.get("ResourceProperties", {})
              dashboard_name = props["DashboardName"]

              try:
                  if request_type in ("Create", "Update"):
                      namespace = props.get("MetricNamespace", "SecurityObservability")
                      name_prefix = props.get("NamePrefix", "security-posture")
                      account_ids = props["MemberAccountIds"]
                      if isinstance(account_ids, str):
                          account_ids = [a.strip() for a in account_ids.split(",") if a.strip()]
                      region = props.get("Region") or context.invoked_function_arn.split(":")[3]

                      body = build_dashboard_body(namespace, name_prefix, account_ids, region)
                      cloudwatch.put_dashboard(DashboardName=dashboard_name, DashboardBody=json.dumps(body))
                      send_cfn_response(event, context, "SUCCESS", physical_resource_id=dashboard_name)

                  elif request_type == "Delete":
                      physical_id = event.get("PhysicalResourceId", dashboard_name)
                      try:
                          cloudwatch.delete_dashboards(DashboardNames=[physical_id])
                      except ClientError as exc:
                          if exc.response["Error"]["Code"] not in ("ResourceNotFound", "ResourceNotFoundException"):
                              raise
                      send_cfn_response(event, context, "SUCCESS", physical_resource_id=physical_id)

                  else:
                      send_cfn_response(event, context, "SUCCESS", physical_resource_id=dashboard_name)

              except Exception as exc:
                  print(f"ERROR: {exc}")
                  send_cfn_response(event, context, "FAILED", reason=str(exc),
                                     physical_resource_id=event.get("PhysicalResourceId", dashboard_name))

  # ---------------------------------------------------------------------
  # The custom resource that actually triggers the Lambda above
  # ---------------------------------------------------------------------
  OrgDashboard:
    Type: Custom::SecurityPostureOrgDashboard
    Properties:
      ServiceToken: !GetAtt DashboardGeneratorFunction.Arn
      DashboardName: !Ref DashboardName
      MemberAccountIds: !Join [",", !Ref MemberAccountIds]
      MetricNamespace: !Ref MetricNamespace
      NamePrefix: !Ref NamePrefix
      Region: !Ref "AWS::Region"

Outputs:
  DashboardUrl:
    Description: Console URL to open the cross-account dashboard directly
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${DashboardName}"
