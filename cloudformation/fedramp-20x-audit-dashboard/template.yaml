    Description: Name of the scheduled audit-evidence collector Lambda
    Value: !Ref AuditCollectorFunction

  AuditCollectorLogGroupName:
    Description: Log group for the collector Lambda (also where flagged resource IDs are printed)
    Value: !Ref AuditCollectorLogGroup
