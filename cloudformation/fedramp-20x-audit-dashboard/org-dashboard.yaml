AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Org-wide FedRAMP 20x continuous-audit-evidence dashboard. Deploy this
  ONCE, in your central monitoring account (the OAM sink — see
  ../../org-observability/oam-sink), after every member account has an OAM
  Link plus this folder's collector.yaml, as well as the collectors for
  nhi-governance-dashboard, network-exposure-dashboard, and
  security-posture-dashboard, whose metrics this dashboard also reads.
  This template has no scanning logic of its own — it builds a
  cross-account CloudWatch dashboard from metrics every linked account's
  collectors already publish locally. Every widget title carries its
  FedRAMP 20x KSI ID; see README.md for the full mapping.

  CloudFormation can't loop-generate DashboardBody JSON natively, so this
  uses a small Lambda-backed custom resource to render the dashboard from a
  list of member account IDs at deploy time, same as
  nhi-governance-dashboard's org-dashboard.yaml. The Terraform version
  (org-dashboard/main.tf) does this natively with a `for` expression.

Parameters:
  DashboardName:
    Type: String
    Default: fedramp-20x-audit-org-dashboard
    Description: Name of the cross-account CloudWatch dashboard.

  MemberAccountIds:
    Type: CommaDelimitedList
    Description: >-
      Every member account ID whose collector metrics should appear on this
      dashboard (the same accounts you deployed collector.yaml and the OAM
      Link to). Does not need to include the monitoring account itself
      unless it also runs its own collectors.

  MetricNamespace:
    Type: String
    Default: FedRAMP20xAudit
    Description: Must match the MetricNamespace parameter used when deploying collector.yaml in every member account.

  NhiGovernanceNamespace:
    Type: String
    Default: NHIGovernance
    Description: Must match the MetricNamespace parameter used to deploy nhi-governance-dashboard's collector in every member account.

  NetworkExposureNamespace:
    Type: String
    Default: NetworkExposure
    Description: Must match the MetricNamespace parameter used to deploy network-exposure-dashboard's collector in every member account.

  SecurityObservabilityNamespace:
    Type: String
    Default: SecurityObservability
    Description: Must match the MetricNamespace parameter used to deploy security-posture-dashboard's collector in every member account.

  LogRetentionDays:
    Type: Number
    Default: 365
    Description: Retention for the dashboard-generator Lambda's own log group.
    AllowedValues:
      [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]

Resources:
  # ---------------------------------------------------------------------
  # KMS key encrypting the generator Lambda's log group
  # ---------------------------------------------------------------------
  DashboardGeneratorKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Encrypts the ${DashboardName} generator Lambda's log group"
      EnableKeyRotation: true
      KeyPolicy: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "AllowAccountKeyAdministration",
              "Effect": "Allow",
              "Principal": { "AWS": "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" },
              "Action": "kms:*",
              "Resource": "*"
            },
            {
              "Sid": "AllowCloudWatchLogsToUseKey",
              "Effect": "Allow",
              "Principal": { "Service": "logs.${AWS::Region}.amazonaws.com" },
              "Action": [
                "kms:Encrypt*", "kms:Decrypt*", "kms:ReEncrypt*",
                "kms:GenerateDataKey*", "kms:Describe*"
              ],
              "Resource": "*",
              "Condition": {
                "ArnLike": {
                  "kms:EncryptionContext:aws:logs:arn": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"
                }
              }
            },
            {
              "Sid": "AllowLambdaAndSqsServices",
              "Effect": "Allow",
              "Principal": {
                "Service": ["lambda.amazonaws.com", "sqs.amazonaws.com"]
              },
              "Action": [
                "kms:Encrypt*", "kms:Decrypt*", "kms:ReEncrypt*",
                "kms:GenerateDataKey*", "kms:Describe*"
              ],
              "Resource": "*"
            }
          ]
        }

  DashboardGeneratorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${DashboardName}-generator"
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !GetAtt DashboardGeneratorKmsKey.Arn

  DashboardGeneratorDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${DashboardName}-generator-dlq"
      MessageRetentionPeriod: 1209600 # 14 days
      KmsMasterKeyId: !Ref DashboardGeneratorKmsKey

  # ---------------------------------------------------------------------
  # IAM role for the generator Lambda — only touches the one dashboard it owns
  # ---------------------------------------------------------------------
  DashboardGeneratorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${DashboardName}-generator-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: manage-this-dashboard-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutDashboard
                  - cloudwatch:DeleteDashboards
                  - cloudwatch:GetDashboard
                Resource: !Sub "arn:${AWS::Partition}:cloudwatch::${AWS::AccountId}:dashboard/${DashboardName}"
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt DashboardGeneratorDlq.Arn

  # ---------------------------------------------------------------------
  # Generator Lambda — renders and applies the DashboardBody at deploy time
  # ---------------------------------------------------------------------
  DashboardGeneratorFunction:
    Type: AWS::Lambda::Function
    DependsOn: DashboardGeneratorLogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_117
            comment: >-
              CloudFormation custom-resource Lambda that only calls the
              regional CloudWatch control-plane API at deploy time; a VPC
              would add nothing but a NAT gateway bill.
          - id: CKV_AWS_272
            comment: >-
              No AWS Signer code-signing pipeline exists for this account;
              out of scope for a public template repo since the profile ARN
              is account-specific.
    Properties:
      FunctionName: !Sub "${DashboardName}-generator"
      Description: CloudFormation custom-resource handler that builds and applies the org-wide FedRAMP 20x audit dashboard's DashboardBody.
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt DashboardGeneratorRole.Arn
      ReservedConcurrentExecutions: 1
      KmsKeyArn: !GetAtt DashboardGeneratorKmsKey.Arn
      DeadLetterConfig:
        TargetArn: !GetAtt DashboardGeneratorDlq.Arn
      TracingConfig:
        Mode: Active
      Code:
        ZipFile: |
          import json
          import urllib.request

          import boto3
          from botocore.exceptions import ClientError

          cloudwatch = boto3.client("cloudwatch")


          def send_cfn_response(event, context, status, data=None, physical_resource_id=None, reason=None):
              body = json.dumps({
                  "Status": status,
                  "Reason": reason or f"See CloudWatch Logs: {context.log_stream_name}",
                  "PhysicalResourceId": physical_resource_id or event.get("PhysicalResourceId") or event["LogicalResourceId"],
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "NoEcho": False,
                  "Data": data or {},
              }).encode("utf-8")
              req = urllib.request.Request(
                  event["ResponseURL"], data=body, method="PUT",
                  headers={"Content-Type": "", "Content-Length": str(len(body))},
              )
              urllib.request.urlopen(req)


          # ---------------------------------------------------------------
          # Widget builders — same "hidden per-account entry + one visible
          # SUM() expression" recipe used by every org-dashboard in this
          # repo. See ../../org-observability/README.md for the general
          # pattern this is built on.
          # ---------------------------------------------------------------
          def _sum_across_accounts(namespace, metric_name, account_ids, label, stat="Maximum", period=86400, id_prefix="m"):
              entries = []
              ids = []
              for i, acct in enumerate(account_ids):
                  mid = f"{id_prefix}{i}"
                  ids.append(mid)
                  entries.append([namespace, metric_name, {
                      "stat": stat, "period": period, "accountId": acct,
                      "id": mid, "visible": False,
                  }])
              entries.append([{
                  "expression": f"SUM([{','.join(ids)}])",
                  "label": label,
                  "id": f"total_{id_prefix}",
              }])
              return entries


          def _single_value_widget(x, y, w, h, title, namespace, metric_name, account_ids, region, stat="Maximum"):
              return {
                  "type": "metric", "x": x, "y": y, "width": w, "height": h,
                  "properties": {
                      "title": title, "view": "singleValue", "region": region,
                      "metrics": _sum_across_accounts(namespace, metric_name, account_ids, title, stat=stat),
                  },
              }


          def _trend_widget(x, y, w, h, title, namespace, series, account_ids, region):
              metrics = []
              for i, (metric_name, label, stat) in enumerate(series):
                  metrics.extend(_sum_across_accounts(namespace, metric_name, account_ids, label, stat=stat, id_prefix=f"s{i}_"))
              return {
                  "type": "metric", "x": x, "y": y, "width": w, "height": h,
                  "properties": {"title": title, "view": "timeSeries", "region": region, "metrics": metrics},
              }


          def _region_breakdown_bar_widget(x, y, w, h, title, namespace, metric_name, account_ids, region):
              metrics = []
              for i, acct in enumerate(account_ids):
                  metrics.append([{
                      "expression": f"SEARCH('{{{namespace},Region}} MetricName=\"{metric_name}\"', 'Maximum', 86400)",
                      "id": f"s{i}",
                      "accountId": acct,
                      "label": acct + " - ${PROP('Dim.Region')}",
                  }])
              return {
                  "type": "metric", "x": x, "y": y, "width": w, "height": h,
                  "properties": {"title": title, "view": "bar", "region": region, "metrics": metrics},
              }


          def build_dashboard_body(namespaces, account_ids, region):
              ns = namespaces["audit"]
              nhi = namespaces["nhi"]
              net = namespaces["network"]
              sec = namespaces["security"]
              widgets = [
                  _single_value_widget(0, 0, 4, 4, "Config Rules Non-Compliant (KSI-MLA-EVC, KSI-SVC-ACM)", ns, "ConfigRulesNonCompliant", account_ids, region),
                  _single_value_widget(4, 0, 4, 4, "Accounts With CloudTrail Logging Active (KSI-MLA-OSM, KSI-MLA-LET)", ns, "CloudTrailLoggingActive", account_ids, region, stat="Sum"),
                  _single_value_widget(8, 0, 4, 4, "Backup Jobs Failed, Last 24h (KSI-RPL-TRC)", ns, "BackupJobsFailed24h", account_ids, region, stat="Sum"),
                  _single_value_widget(12, 0, 4, 4, "Access Analyzer External-Access Findings (KSI-IAM-SUS)", ns, "AccessAnalyzerExternalAccessFindings", account_ids, region),
                  _single_value_widget(16, 0, 4, 4, "Users Without MFA, Org-Wide (KSI-IAM-APM)", nhi, "UsersWithoutMfa", account_ids, region),
                  _single_value_widget(20, 0, 4, 4, "Stale IAM Roles, Org-Wide (KSI-IAM-ELP)", nhi, "StaleIamRoles", account_ids, region),
                  _trend_widget(0, 4, 12, 6, "AWS Config Rule Compliance, Org-Wide (KSI-MLA-EVC, KSI-SVC-ACM)", ns,
                                [("ConfigRulesCompliant", "Compliant Rules", "Maximum"),
                                 ("ConfigRulesNonCompliant", "Non-Compliant Rules", "Maximum")], account_ids, region),
                  _trend_widget(12, 4, 12, 6, "Backup Coverage & Job Outcomes, Org-Wide (KSI-RPL-ABO, KSI-RPL-TRC)", ns,
                                [("BackupPlansCount", "Backup Plans", "Maximum"),
                                 ("BackupJobsSucceeded24h", "Jobs Succeeded (24h)", "Sum"),
                                 ("BackupJobsFailed24h", "Jobs Failed (24h)", "Sum")], account_ids, region),
                  _trend_widget(0, 10, 12, 6, "Security Hub / GuardDuty High-Severity Findings, Org-Wide (KSI-MLA-RVL, KSI-IAM-SUS)", sec,
                                [("SecurityHubCriticalFindings", "Security Hub Critical", "Sum"),
                                 ("SecurityHubHighFindings", "Security Hub High", "Sum"),
                                 ("GuardDutyHighSeverityFindings", "GuardDuty High Severity", "Sum")], account_ids, region),
                  _trend_widget(12, 10, 12, 6, "Public-Facing Resources, Org-Wide (KSI-CNA-MAT, KSI-SVC-SIN)", net,
                                [("PublicEc2Instances", "Public EC2", "Maximum"),
                                 ("PubliclyAccessibleRdsInstances", "Public RDS", "Maximum"),
                                 ("InternetFacingLoadBalancers", "Internet-Facing LBs", "Maximum"),
                                 ("PubliclyAccessibleS3Buckets", "Public S3 Buckets", "Maximum")], account_ids, region),
                  _region_breakdown_bar_widget(0, 16, 12, 6, "Open Security Group Rules by Account/Region (KSI-CNA-RNT)", net, "OpenSecurityGroupRules", account_ids, region),
                  _trend_widget(12, 16, 12, 6, "External-Trust IAM Roles, Org-Wide (KSI-IAM-JIT)", nhi,
                                [("ExternalTrustRoles", "External-Trust Roles", "Maximum")], account_ids, region),
                  _single_value_widget(0, 22, 4, 4, "RDS Instances Not Multi-AZ, Org-Wide (KSI-CNA-OFA)", ns, "RdsInstancesNotMultiAz", account_ids, region, stat="Sum"),
                  _single_value_widget(4, 22, 4, 4, "Auto Scaling Groups in a Single AZ, Org-Wide (KSI-CNA-OFA)", ns, "AsgSingleAzCount", account_ids, region, stat="Sum"),
                  _single_value_widget(8, 22, 4, 4, "Config Rules Without Auto-Remediation, Org-Wide (KSI-CNA-EIS)", ns, "ConfigRulesWithoutRemediation", account_ids, region, stat="Sum"),
                  _single_value_widget(12, 22, 4, 4, "VPCs Relying on Default NACL Only, Org-Wide (KSI-CNA-ULN)", ns, "VpcsWithoutCustomNacl", account_ids, region, stat="Sum"),
                  _single_value_widget(16, 22, 4, 4, "ACM Certificates Expiring Within 30 Days, Org-Wide (KSI-SVC-VCM)", ns, "AcmCertsExpiringSoon", account_ids, region, stat="Sum"),
                  _single_value_widget(20, 22, 4, 4, "Security Hub Standards Score, Org-Wide Avg % Passed (KSI-SVC-EIS)", ns, "SecurityHubStandardsScorePercent", account_ids, region, stat="Average"),
                  _trend_widget(0, 26, 12, 6, "Config Auto-Remediation Coverage, Org-Wide (KSI-CNA-EIS)", ns,
                                [("ConfigRulesWithRemediation", "Rules With Remediation", "Sum"),
                                 ("ConfigRulesWithoutRemediation", "Rules Without Remediation", "Sum")], account_ids, region),
                  _trend_widget(12, 26, 12, 6, "Inspector Findings, Org-Wide (KSI-SCR-MON)", ns,
                                [("Inspector2CriticalFindings", "Critical", "Sum"),
                                 ("Inspector2HighFindings", "High", "Sum")], account_ids, region),
                  _trend_widget(0, 32, 12, 6, "Non-User Auth & Best-Practice Comparison, Org-Wide (KSI-IAM-SNU, KSI-CNA-IBP)", ns,
                                [("Ec2InstancesWithoutInstanceProfile", "EC2 Without Instance Profile", "Sum"),
                                 ("TrustedAdvisorSecurityChecksFlagged", "Trusted Advisor Checks Flagged", "Sum")], account_ids, region),
                  _trend_widget(12, 32, 12, 6, "Network Segmentation & Secure Transport, Org-Wide (KSI-CNA-ULN, KSI-SVC-VCM)", ns,
                                [("VpcEndpointsCount", "VPC Endpoints", "Sum"),
                                 ("S3BucketsWithoutSecureTransportPolicy", "S3 Buckets Without Secure-Transport Policy", "Sum")], account_ids, region),
                  _single_value_widget(0, 38, 4, 4, "Accounts With GuardDuty Enabled, Org-Wide (KSI-MLA-OSM)", ns, "GuardDutyEnabled", account_ids, region, stat="Sum"),
                  _single_value_widget(4, 38, 4, 4, "Accounts With Security Hub Enabled, Org-Wide (KSI-MLA-OSM)", ns, "SecurityHubEnabled", account_ids, region, stat="Sum"),
                  _single_value_widget(8, 38, 4, 4, "Accounts With Inspector Enabled, Org-Wide (KSI-SCR-MON)", ns, "Inspector2Enabled", account_ids, region, stat="Sum"),
                  _single_value_widget(12, 38, 4, 4, "Accounts With EBS Encryption By Default, Org-Wide (KSI-SVC-SIN)", ns, "EbsEncryptionByDefaultEnabled", account_ids, region, stat="Sum"),
                  _single_value_widget(16, 38, 4, 4, "RDS Instances Unencrypted, Org-Wide (KSI-SVC-SIN)", ns, "RdsInstancesUnencrypted", account_ids, region, stat="Sum"),
                  _single_value_widget(20, 38, 4, 4, "Accounts With S3 Block Public Access Enabled, Org-Wide (KSI-SVC-SIN)", ns, "S3AccountBlockPublicAccessEnabled", account_ids, region, stat="Sum"),
                  _single_value_widget(0, 42, 4, 4, "Accounts With Compliant Password Policy, Org-Wide (KSI-IAM-APM)", ns, "IamPasswordPolicyCompliant", account_ids, region, stat="Sum"),
                  _single_value_widget(4, 42, 4, 4, "Inactive IAM Users, Org-Wide (KSI-IAM-AAM)", nhi, "InactiveIamUsers", account_ids, region, stat="Sum"),
              ]
              return {"widgets": widgets}


          def handler(event, context):
              request_type = event["RequestType"]
              props = event.get("ResourceProperties", {})
              dashboard_name = props["DashboardName"]

              try:
                  if request_type in ("Create", "Update"):
                      namespaces = {
                          "audit": props.get("MetricNamespace", "FedRAMP20xAudit"),
                          "nhi": props.get("NhiGovernanceNamespace", "NHIGovernance"),
                          "network": props.get("NetworkExposureNamespace", "NetworkExposure"),
                          "security": props.get("SecurityObservabilityNamespace", "SecurityObservability"),
                      }
                      account_ids = props["MemberAccountIds"]
                      if isinstance(account_ids, str):
                          account_ids = [a.strip() for a in account_ids.split(",") if a.strip()]
                      region = props.get("Region") or context.invoked_function_arn.split(":")[3]

                      body = build_dashboard_body(namespaces, account_ids, region)
                      cloudwatch.put_dashboard(DashboardName=dashboard_name, DashboardBody=json.dumps(body))
                      send_cfn_response(event, context, "SUCCESS", physical_resource_id=dashboard_name)

                  elif request_type == "Delete":
                      physical_id = event.get("PhysicalResourceId", dashboard_name)
                      try:
                          cloudwatch.delete_dashboards(DashboardNames=[physical_id])
                      except ClientError as exc:
                          if exc.response["Error"]["Code"] not in ("ResourceNotFound", "ResourceNotFoundException"):
                              raise
                      send_cfn_response(event, context, "SUCCESS", physical_resource_id=physical_id)

                  else:
                      send_cfn_response(event, context, "SUCCESS", physical_resource_id=dashboard_name)

              except Exception as exc:
                  print(f"ERROR: {exc}")
                  send_cfn_response(event, context, "FAILED", reason=str(exc),
                                     physical_resource_id=event.get("PhysicalResourceId", dashboard_name))

  # ---------------------------------------------------------------------
  # The custom resource that actually triggers the Lambda above
  # ---------------------------------------------------------------------
  OrgDashboard:
    Type: Custom::FedRamp20xOrgDashboard
    Properties:
      ServiceToken: !GetAtt DashboardGeneratorFunction.Arn
      DashboardName: !Ref DashboardName
      MemberAccountIds: !Join [",", !Ref MemberAccountIds]
      MetricNamespace: !Ref MetricNamespace
      NhiGovernanceNamespace: !Ref NhiGovernanceNamespace
      NetworkExposureNamespace: !Ref NetworkExposureNamespace
      SecurityObservabilityNamespace: !Ref SecurityObservabilityNamespace
      Region: !Ref "AWS::Region"

Outputs:
  DashboardUrl:
    Description: Console URL to open the cross-account dashboard directly
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${DashboardName}"
