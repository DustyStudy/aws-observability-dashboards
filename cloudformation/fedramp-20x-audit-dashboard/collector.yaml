AWSTemplateFormatVersion: "2010-09-09"
Description: >
  FedRAMP 20x audit-evidence collector — the per-account half of
  fedramp-20x-audit-dashboard, meant to be deployed via a CloudFormation
  StackSet to every account in your organization (see
  ../../org-observability/README.md). This stack has NO dashboard; it only
  runs a daily scan, across every enabled region in the account, of Config,
  CloudTrail, Backup, Access Analyzer, RDS/ASG HA posture, Config
  auto-remediation, VPC endpoint/NACL posture, ACM/S3 secure-transport
  checks, a Security Hub score, account-wide Inspector findings, EC2
  instance-profile coverage, whether GuardDuty/Security Hub/Inspector are
  actually enabled, EBS/RDS/S3 encryption defaults, and IAM password policy
  strength, then publishes account-wide metrics. It intentionally does NOT
  duplicate checks the other six dashboards in this repo already publish.
  Pair this with org-dashboard.yaml, deployed once in your central
  monitoring account, to see every account's evidence in one place. For a
  single account, use
  template.yaml instead.

Parameters:
  NamePrefix:
    Type: String
    Default: fedramp-20x-audit
    Description: Prefix applied to all resource names created by this stack.
    AllowedPattern: "^[a-z0-9-]{1,40}$"

  LogRetentionInDays:
    Type: Number
    Default: 365
    Description: >-
      Retention period for the collector Lambda's log group. Defaults to 365
      to satisfy Checkov CKV_AWS_338 (retain at least 1 year).
    AllowedValues:
      [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]

  MetricNamespace:
    Type: String
    Default: FedRAMP20xAudit
    Description: CloudWatch custom metric namespace the collector Lambda publishes into.

  AuditScanSchedule:
    Type: String
    Default: rate(1 day)
    Description: EventBridge schedule expression for the collector Lambda.

Resources:
  # ---------------------------------------------------------------------
  # KMS key used to encrypt the collector's log group, env vars, and DLQ
  # ---------------------------------------------------------------------
  AuditKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Encrypts FedRAMP 20x audit-collector resources for the ${NamePrefix} dashboard"
      EnableKeyRotation: true
      KeyPolicy: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "AllowAccountKeyAdministration",
              "Effect": "Allow",
              "Principal": { "AWS": "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" },
              "Action": "kms:*",
              "Resource": "*"
            },
            {
              "Sid": "AllowCloudWatchLogsToUseKey",
              "Effect": "Allow",
              "Principal": { "Service": "logs.${AWS::Region}.amazonaws.com" },
              "Action": [
                "kms:Encrypt*",
                "kms:Decrypt*",
                "kms:ReEncrypt*",
                "kms:GenerateDataKey*",
                "kms:Describe*"
              ],
              "Resource": "*",
              "Condition": {
                "ArnLike": {
                  "kms:EncryptionContext:aws:logs:arn": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"
                }
              }
            },
            {
              "Sid": "AllowLambdaAndSqsServices",
              "Effect": "Allow",
              "Principal": {
                "Service": ["lambda.amazonaws.com", "sqs.amazonaws.com"]
              },
              "Action": [
                "kms:Encrypt*",
                "kms:Decrypt*",
                "kms:ReEncrypt*",
                "kms:GenerateDataKey*",
                "kms:Describe*"
              ],
              "Resource": "*"
            }
          ]
        }

  AuditKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${NamePrefix}-observability"
      TargetKeyId: !Ref AuditKmsKey

  # ---------------------------------------------------------------------
  # Dead-letter queue for the collector Lambda
  # ---------------------------------------------------------------------
  AuditCollectorDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${NamePrefix}-collector-dlq"
      MessageRetentionPeriod: 1209600 # 14 days
      KmsMasterKeyId: !Ref AuditKmsKey

  # ---------------------------------------------------------------------
  # Log group for the collector Lambda
  # ---------------------------------------------------------------------
  AuditCollectorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NamePrefix}-collector"
      RetentionInDays: !Ref LogRetentionInDays
      KmsKeyId: !GetAtt AuditKmsKey.Arn

  # ---------------------------------------------------------------------
  # IAM role for the collector Lambda
  # ---------------------------------------------------------------------
  AuditCollectorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${NamePrefix}-collector-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSXRayDaemonWriteAccess"
      Policies:
        - PolicyName: audit-evidence-read-and-metric-publish
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadConfigComplianceState
                Effect: Allow
                Action:
                  - config:DescribeConfigurationRecorders
                  - config:DescribeConfigurationRecorderStatus
                  - config:DescribeComplianceByConfigRule
                Resource: "*" # These read-only Config APIs do not support resource-level permissions
              - Sid: ReadCloudTrailHealth
                Effect: Allow
                Action:
                  - cloudtrail:DescribeTrails
                  - cloudtrail:GetTrailStatus
                Resource: "*" # Read-only trail-health checks across an account-wide, dynamic trail list
              - Sid: ReadBackupCoverage
                Effect: Allow
                Action:
                  - backup:ListBackupPlans
                  - backup:ListBackupJobs
                Resource: "*" # These read-only Backup APIs do not support resource-level permissions
              - Sid: ReadAccessAnalyzerFindings
                Effect: Allow
                Action:
                  - access-analyzer:ListAnalyzers
                  - access-analyzer:ListFindings
                Resource: "*" # Read-only checks across a dynamic, account-wide analyzer/finding list
              - Sid: ReadHighAvailabilityPosture
                Effect: Allow
                Action:
                  - rds:DescribeDBInstances
                  - autoscaling:DescribeAutoScalingGroups
                Resource: "*" # These read-only APIs do not support resource-level permissions
              - Sid: ReadAutoRemediationCoverage
                Effect: Allow
                Action:
                  - config:DescribeRemediationConfigurations
                Resource: "*" # Read-only Config API scoped by rule name at call time, not by ARN
              - Sid: ReadNetworkSegmentationPosture
                Effect: Allow
                Action:
                  - ec2:DescribeVpcEndpoints
                  - ec2:DescribeVpcs
                  - ec2:DescribeNetworkAcls
                  - ec2:DescribeInstances
                  - ec2:DescribeRegions
                Resource: "*" # These read-only EC2 APIs do not support resource-level permissions
              - Sid: ReadSecureCommunicationsPosture
                Effect: Allow
                Action:
                  - acm:ListCertificates
                  - acm:DescribeCertificate
                  - s3:ListAllMyBuckets
                  - s3:GetBucketPolicy
                Resource: "*" # Read-only checks across a dynamic, account-wide cert/bucket list
              - Sid: ReadSecurityHubScore
                Effect: Allow
                Action:
                  - securityhub:GetFindings
                Resource: "*" # Read-only, account-wide finding query
              - Sid: ReadInspectorFindings
                Effect: Allow
                Action:
                  - inspector2:ListFindings
                Resource: "*" # Read-only, account-wide finding query
              - Sid: ReadTrustedAdvisorChecks
                Effect: Allow
                Action:
                  - support:DescribeTrustedAdvisorChecks
                  - support:DescribeTrustedAdvisorCheckResult
                Resource: "*" # The Support API does not support resource-level permissions
              - Sid: ReadDetectorStatus
                Effect: Allow
                Action:
                  - guardduty:ListDetectors
                  - guardduty:GetDetector
                  - securityhub:DescribeHub
                  - inspector2:BatchGetAccountStatus
                Resource: "*" # Read-only status checks; none of these support resource-level permissions
              - Sid: ReadAccountEncryptionDefaults
                Effect: Allow
                Action:
                  - ec2:GetEbsEncryptionByDefault
                  - s3:GetAccountPublicAccessBlock
                Resource: "*" # Account-level settings, not per-resource
              - Sid: ReadPasswordPolicy
                Effect: Allow
                Action:
                  - iam:GetAccountPasswordPolicy
                Resource: "*" # Account-level setting, not per-resource
              - Sid: ReadOwnAccountId
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: "*" # Required to scope the S3 account-level Block Public Access call
              - Sid: PublishAuditMetrics
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*" # PutMetricData does not support resource-level permissions
                Condition:
                  StringEquals:
                    cloudwatch:namespace: !Ref MetricNamespace
              - Sid: SendToDlq
                Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt AuditCollectorDlq.Arn

  # ---------------------------------------------------------------------
  # Audit-evidence collector Lambda: checks AWS Config recorder/rule
  # compliance, CloudTrail health, AWS Backup plan coverage and recent job
  # outcomes, and IAM Access Analyzer external-access findings, then
  # publishes counts as CloudWatch metrics. Flagged resource identifiers are
  # printed to the Lambda's own CloudWatch Logs for triage, since metrics
  # only carry numbers, not names. Kept in sync by hand with
  # ../../terraform/fedramp-20x-audit-dashboard/lambda/fedramp20x_collector.py
  # — the Terraform version packages that file directly instead of inlining it.
  # ---------------------------------------------------------------------
  AuditCollectorFunction:
    Type: AWS::Lambda::Function
    DependsOn: AuditCollectorLogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_117
            comment: >-
              This function calls global/regional read-only control-plane
              APIs (Config, CloudTrail, Backup, Access Analyzer) with no VPC
              endpoint benefit for a read-only audit-evidence scan, so a VPC
              would mean NAT gateways for nothing.
    Properties:
      FunctionName: !Sub "${NamePrefix}-collector"
      Description: Checks AWS Config, CloudTrail, AWS Backup, and IAM Access Analyzer, and publishes FedRAMP 20x audit-evidence metrics.
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt AuditCollectorRole.Arn
      Timeout: 900
      MemorySize: 1024
      ReservedConcurrentExecutions: 1
      KmsKeyArn: !GetAtt AuditKmsKey.Arn
      DeadLetterConfig:
        TargetArn: !GetAtt AuditCollectorDlq.Arn
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          METRIC_NAMESPACE: !Ref MetricNamespace
      Code:
        ZipFile: |
          import json
          import os
          from datetime import datetime, timedelta, timezone

          import boto3
          from botocore.exceptions import ClientError

          METRIC_NAMESPACE = os.environ.get("METRIC_NAMESPACE", "FedRAMP20xAudit")

          # This collector fills the gaps the other six dashboards in this repo don't
          # already cover. First tranche: AWS Config recorder/rule compliance,
          # CloudTrail health, AWS Backup plan coverage and job outcomes, and IAM
          # Access Analyzer external-access findings. Second tranche (added after the
          # first version shipped): RDS/ASG availability-zone coverage, AWS Config
          # auto-remediation coverage, VPC endpoint/NACL posture, ACM certificate
          # expiry and S3 secure-transport policies, a Security Hub standards score,
          # account-wide Inspector findings (not just EKS), EC2 instances missing an
          # IAM instance profile, and Trusted Advisor security-check status where the
          # support plan allows it. Third tranche: whether GuardDuty/Security Hub/
          # Inspector are actually turned ON (a finding *count* of zero looks
          # identical whether an account is clean or the detector was never enabled —
          # this closes that blind spot), account-level EBS encryption-by-default,
          # RDS storage encryption, S3 account-level Block Public Access, and IAM
          # account password policy strength. It does NOT duplicate MFA/stale-key
          # checks (already in nhi-governance-dashboard), open-security-group/
          # public-resource checks (already in network-exposure-dashboard), or
          # Security Hub/GuardDuty finding *counts* (already in
          # security-posture-dashboard) — the Security Hub check here is a different
          # thing, a pass/fail *score* across enabled standards, and the detector
          # checks here are about whether the service is running at all, not what it
          # found. See README.md in this folder for the full KSI-to-metric mapping
          # across all eight dashboards.


          def _check_config(config, findings, non_compliant_rule_names=None):
              metrics = {"ConfigRecorderEnabled": 0, "ConfigRulesCompliant": 0, "ConfigRulesNonCompliant": 0}
              try:
                  recorders = config.describe_configuration_recorders().get("ConfigurationRecorders", [])
                  statuses = config.describe_configuration_recorder_status().get("ConfigurationRecordersStatus", [])
                  recording = any(s.get("recording") for s in statuses)
                  metrics["ConfigRecorderEnabled"] = 1 if recorders and recording else 0
                  if not metrics["ConfigRecorderEnabled"]:
                      findings.append("CONFIG_RECORDER_NOT_ACTIVE")
              except ClientError as exc:
                  print(f"Config recorder check failed: {exc}")

              try:
                  paginator = config.get_paginator("describe_compliance_by_config_rule")
                  for page in paginator.paginate():
                      for rule in page.get("ComplianceByConfigRules", []):
                          status = rule.get("Compliance", {}).get("ComplianceType")
                          rule_name = rule.get("ConfigRuleName")
                          if status == "NON_COMPLIANT":
                              metrics["ConfigRulesNonCompliant"] += 1
                              findings.append(f"CONFIG_RULE_NON_COMPLIANT rule={rule_name}")
                              if non_compliant_rule_names is not None:
                                  non_compliant_rule_names.append(rule_name)
                          elif status == "COMPLIANT":
                              metrics["ConfigRulesCompliant"] += 1
              except ClientError as exc:
                  print(f"Config rule compliance check failed: {exc}")

              return metrics


          def _check_cloudtrail(cloudtrail, findings):
              metrics = {
                  "CloudTrailMultiRegionEnabled": 0,
                  "CloudTrailLogFileValidationEnabled": 0,
                  "CloudTrailLoggingActive": 0,
              }
              try:
                  trails = cloudtrail.describe_trails(includeShadowTrails=False).get("trailList", [])
                  if not trails:
                      findings.append("NO_CLOUDTRAIL_TRAILS")
                  for trail in trails:
                      if trail.get("IsMultiRegionTrail"):
                          metrics["CloudTrailMultiRegionEnabled"] = 1
                      if trail.get("LogFileValidationEnabled"):
                          metrics["CloudTrailLogFileValidationEnabled"] = 1
                      try:
                          status = cloudtrail.get_trail_status(Name=trail["TrailARN"])
                          if status.get("IsLogging"):
                              metrics["CloudTrailLoggingActive"] = 1
                      except ClientError as exc:
                          print(f"get_trail_status failed for {trail.get('Name')}: {exc}")
              except ClientError as exc:
                  print(f"CloudTrail check failed: {exc}")

              return metrics


          def _check_backups(backup, findings):
              metrics = {"BackupPlansCount": 0, "BackupJobsSucceeded24h": 0, "BackupJobsFailed24h": 0}
              try:
                  plans = backup.list_backup_plans().get("BackupPlansList", [])
                  metrics["BackupPlansCount"] = len(plans)
                  if not plans:
                      findings.append("NO_BACKUP_PLANS")
              except ClientError as exc:
                  print(f"Backup plan check failed: {exc}")

              since = datetime.now(timezone.utc) - timedelta(days=1)
              try:
                  paginator = backup.get_paginator("list_backup_jobs")
                  for page in paginator.paginate(ByCreatedAfter=since):
                      for job in page.get("BackupJobs", []):
                          state = job.get("State")
                          if state == "FAILED":
                              metrics["BackupJobsFailed24h"] += 1
                              findings.append(f"BACKUP_JOB_FAILED resource={job.get('ResourceArn')}")
                          elif state == "COMPLETED":
                              metrics["BackupJobsSucceeded24h"] += 1
              except ClientError as exc:
                  print(f"Backup job check failed: {exc}")

              return metrics


          def _check_access_analyzer(analyzer_client, findings):
              metrics = {"AccessAnalyzerActive": 0, "AccessAnalyzerExternalAccessFindings": 0}
              try:
                  analyzers = analyzer_client.list_analyzers(type="ACCOUNT").get("analyzers", [])
                  active = [a for a in analyzers if a.get("status") == "ACTIVE"]
                  metrics["AccessAnalyzerActive"] = 1 if active else 0
                  if not active:
                      findings.append("NO_ACTIVE_ACCESS_ANALYZER")
                      return metrics

                  for analyzer in active:
                      try:
                          paginator = analyzer_client.get_paginator("list_findings")
                          for page in paginator.paginate(
                              analyzerArn=analyzer["arn"], filter={"status": {"eq": ["ACTIVE"]}}
                          ):
                              for finding in page.get("findings", []):
                                  metrics["AccessAnalyzerExternalAccessFindings"] += 1
                                  findings.append(f"EXTERNAL_ACCESS_FINDING resource={finding.get('resource')}")
                      except ClientError as exc:
                          print(f"list_findings failed for {analyzer['arn']}: {exc}")
              except ClientError as exc:
                  print(f"Access Analyzer check failed: {exc}")

              return metrics


          def _check_high_availability(rds, autoscaling, findings):
              """KSI-CNA-OFA: are resources optimized for HA and rapid recovery."""
              metrics = {"RdsInstancesNotMultiAz": 0, "AsgSingleAzCount": 0}
              try:
                  paginator = rds.get_paginator("describe_db_instances")
                  for page in paginator.paginate():
                      for db in page.get("DBInstances", []):
                          if not db.get("MultiAZ", False):
                              metrics["RdsInstancesNotMultiAz"] += 1
                              findings.append(f"RDS_NOT_MULTI_AZ instance={db.get('DBInstanceIdentifier')}")
              except ClientError as exc:
                  print(f"RDS Multi-AZ check failed: {exc}")

              try:
                  paginator = autoscaling.get_paginator("describe_auto_scaling_groups")
                  for page in paginator.paginate():
                      for asg in page.get("AutoScalingGroups", []):
                          if len(set(asg.get("AvailabilityZones", []))) < 2:
                              metrics["AsgSingleAzCount"] += 1
                              findings.append(f"ASG_SINGLE_AZ name={asg.get('AutoScalingGroupName')}")
              except ClientError as exc:
                  print(f"ASG availability-zone check failed: {exc}")

              return metrics


          def _check_auto_remediation(config, non_compliant_rule_names, findings):
              """KSI-CNA-EIS: are non-compliant resources automatically brought back to their intended state."""
              metrics = {"ConfigRulesWithRemediation": 0, "ConfigRulesWithoutRemediation": 0}
              if not non_compliant_rule_names:
                  return metrics
              try:
                  resp = config.describe_remediation_configurations(ConfigRuleNames=non_compliant_rule_names)
                  remediated = {r["ConfigRuleName"] for r in resp.get("RemediationConfigurations", [])}
                  for name in non_compliant_rule_names:
                      if name in remediated:
                          metrics["ConfigRulesWithRemediation"] += 1
                      else:
                          metrics["ConfigRulesWithoutRemediation"] += 1
                          findings.append(f"CONFIG_RULE_NO_REMEDIATION rule={name}")
              except ClientError as exc:
                  print(f"Remediation configuration check failed: {exc}")
              return metrics


          def _check_network_segmentation(ec2, findings):
              """KSI-CNA-ULN: is logical networking used and reviewed to enforce traffic flow controls."""
              metrics = {"VpcEndpointsCount": 0, "VpcsWithoutCustomNacl": 0}
              try:
                  metrics["VpcEndpointsCount"] = len(ec2.describe_vpc_endpoints().get("VpcEndpoints", []))
              except ClientError as exc:
                  print(f"VPC endpoint check failed: {exc}")

              try:
                  vpc_ids = {v["VpcId"] for v in ec2.describe_vpcs().get("Vpcs", [])}
                  nacls = ec2.describe_network_acls().get("NetworkAcls", [])
                  vpcs_with_custom_nacl = {n["VpcId"] for n in nacls if not n.get("IsDefault", False)}
                  for vpc_id in vpc_ids:
                      if vpc_id not in vpcs_with_custom_nacl:
                          metrics["VpcsWithoutCustomNacl"] += 1
                          findings.append(f"VPC_DEFAULT_NACL_ONLY vpc={vpc_id}")
              except ClientError as exc:
                  print(f"NACL check failed: {exc}")

              return metrics


          def _denies_insecure_transport(stmt):
              value = stmt.get("Condition", {}).get("Bool", {}).get("aws:SecureTransport")
              if isinstance(value, list):
                  return "false" in value
              return value == "false"


          def _check_acm_certificates(acm, findings):
              """KSI-SVC-VCM, regional half: ACM certificates expiring soon in this region."""
              metrics = {"AcmCertsExpiringSoon": 0}
              expiry_cutoff = datetime.now(timezone.utc) + timedelta(days=30)

              try:
                  paginator = acm.get_paginator("list_certificates")
                  for page in paginator.paginate(CertificateStatuses=["ISSUED"]):
                      for cert in page.get("CertificateSummaryList", []):
                          try:
                              detail = acm.describe_certificate(CertificateArn=cert["CertificateArn"])["Certificate"]
                              not_after = detail.get("NotAfter")
                              if not_after and not_after <= expiry_cutoff:
                                  metrics["AcmCertsExpiringSoon"] += 1
                                  findings.append(f"ACM_CERT_EXPIRING domain={detail.get('DomainName')}")
                          except ClientError as exc:
                              print(f"describe_certificate failed for {cert.get('CertificateArn')}: {exc}")
              except ClientError as exc:
                  print(f"ACM certificate check failed: {exc}")

              return metrics


          def _check_s3_secure_transport(s3, findings):
              """KSI-SVC-VCM, global half: S3 buckets missing a deny-insecure-transport policy.

              S3 buckets are account-wide, not per-region -- list_buckets() already
              returns every bucket regardless of which region it lives in, so this
              runs exactly once, not once per region.
              """
              metrics = {"S3BucketsWithoutSecureTransportPolicy": 0}
              try:
                  for bucket in s3.list_buckets().get("Buckets", []):
                      name = bucket["Name"]
                      secure = False
                      try:
                          policy = json.loads(s3.get_bucket_policy(Bucket=name)["Policy"])
                          secure = any(
                              stmt.get("Effect") == "Deny" and _denies_insecure_transport(stmt)
                              for stmt in policy.get("Statement", [])
                          )
                      except ClientError:
                          pass  # No bucket policy at all -> definitely not secured this way
                      if not secure:
                          metrics["S3BucketsWithoutSecureTransportPolicy"] += 1
                          findings.append(f"S3_NO_SECURE_TRANSPORT_POLICY bucket={name}")
              except ClientError as exc:
                  print(f"S3 secure-transport check failed: {exc}")

              return metrics


          def _check_security_hub_score(securityhub, findings):
              """KSI-SVC-EIS: are opportunities to improve security persistently evaluated and made.

              Returns raw passed/failed counts rather than a percentage -- when this
              runs once per region, the caller sums passed and failed across every
              region first and computes one account-wide percentage at the end, since
              averaging pre-computed percentages across regions would weight a
              5-control region the same as a 500-control one.
              """
              metrics = {"SecurityHubControlsPassed": 0, "SecurityHubControlsFailed": 0}
              try:
                  paginator = securityhub.get_paginator("get_findings")
                  for page in paginator.paginate(
                      Filters={
                          "RecordState": [{"Value": "ACTIVE", "Comparison": "EQUALS"}],
                          "ComplianceStatus": [
                              {"Value": "PASSED", "Comparison": "EQUALS"},
                              {"Value": "FAILED", "Comparison": "EQUALS"},
                          ],
                      }
                  ):
                      for finding in page.get("Findings", []):
                          status = finding.get("Compliance", {}).get("Status")
                          if status == "PASSED":
                              metrics["SecurityHubControlsPassed"] += 1
                          elif status == "FAILED":
                              metrics["SecurityHubControlsFailed"] += 1
                              findings.append(f"SECURITY_HUB_CONTROL_FAILED id={finding.get('GeneratorId')}")
              except ClientError as exc:
                  print(f"Security Hub score check failed: {exc}")

              return metrics


          def _check_inspector_findings(inspector2, findings):
              """KSI-SCR-MON, account-wide: upstream vulnerability monitoring beyond just EKS/ECR."""
              metrics = {"Inspector2CriticalFindings": 0, "Inspector2HighFindings": 0}
              try:
                  paginator = inspector2.get_paginator("list_findings")
                  for page in paginator.paginate(
                      filterCriteria={
                          "severity": [
                              {"comparison": "EQUALS", "value": "CRITICAL"},
                              {"comparison": "EQUALS", "value": "HIGH"},
                          ],
                          "findingStatus": [{"comparison": "EQUALS", "value": "ACTIVE"}],
                      }
                  ):
                      for finding in page.get("findings", []):
                          severity = finding.get("severity")
                          if severity == "CRITICAL":
                              metrics["Inspector2CriticalFindings"] += 1
                              findings.append(f"INSPECTOR_FINDING severity=CRITICAL arn={finding.get('findingArn')}")
                          elif severity == "HIGH":
                              metrics["Inspector2HighFindings"] += 1
                              findings.append(f"INSPECTOR_FINDING severity=HIGH arn={finding.get('findingArn')}")
              except ClientError as exc:
                  print(f"Inspector2 findings check failed: {exc}")

              return metrics


          def _check_non_user_auth(ec2, findings):
              """KSI-IAM-SNU: are appropriately secure authentication methods used for non-user accounts/services."""
              metrics = {"Ec2InstancesWithoutInstanceProfile": 0}
              try:
                  paginator = ec2.get_paginator("describe_instances")
                  for page in paginator.paginate(
                      Filters=[{"Name": "instance-state-name", "Values": ["running", "stopped"]}]
                  ):
                      for reservation in page.get("Reservations", []):
                          for instance in reservation.get("Instances", []):
                              if not instance.get("IamInstanceProfile"):
                                  metrics["Ec2InstancesWithoutInstanceProfile"] += 1
                                  findings.append(f"EC2_NO_INSTANCE_PROFILE instance={instance.get('InstanceId')}")
              except ClientError as exc:
                  print(f"EC2 instance-profile check failed: {exc}")

              return metrics


          def _check_trusted_advisor(support, findings):
              """KSI-CNA-IBP: is configuration persistently compared against provider best-practice guidance.

              Requires a Business or Enterprise support plan -- Basic/Developer plans
              get a SubscriptionRequiredException, which is reported as
              TrustedAdvisorAvailable=0 rather than an error, since that's itself
              useful signal (an assessor may ask why it's unavailable).
              """
              metrics = {"TrustedAdvisorAvailable": 0, "TrustedAdvisorSecurityChecksFlagged": 0}
              try:
                  checks = support.describe_trusted_advisor_checks(language="en").get("checks", [])
                  metrics["TrustedAdvisorAvailable"] = 1
                  for check in (c for c in checks if c.get("category") == "security"):
                      try:
                          result = support.describe_trusted_advisor_check_result(
                              checkId=check["id"], language="en"
                          ).get("result", {})
                          if result.get("status") in ("error", "warning"):
                              metrics["TrustedAdvisorSecurityChecksFlagged"] += 1
                              findings.append(
                                  f"TRUSTED_ADVISOR_FLAGGED check={check.get('name')} status={result.get('status')}"
                              )
                      except ClientError as exc:
                          print(f"describe_trusted_advisor_check_result failed for {check.get('id')}: {exc}")
              except ClientError as exc:
                  print(f"Trusted Advisor unavailable (requires Business/Enterprise support): {exc}")

              return metrics


          def _check_detector_status(guardduty, securityhub, inspector2, findings):
              """Is the detection tooling itself actually running, not just what it found.

              A finding count of zero looks identical whether the account is clean or
              the detector was never turned on -- this check exists specifically to
              close that blind spot for GuardDuty, Security Hub, and Inspector2.
              """
              metrics = {"GuardDutyEnabled": 0, "SecurityHubEnabled": 0, "Inspector2Enabled": 0}

              try:
                  detector_ids = guardduty.list_detectors().get("DetectorIds", [])
                  if not detector_ids:
                      findings.append("GUARDDUTY_NOT_ENABLED")
                  else:
                      detail = guardduty.get_detector(DetectorId=detector_ids[0])
                      if detail.get("Status") == "ENABLED":
                          metrics["GuardDutyEnabled"] = 1
                      else:
                          findings.append("GUARDDUTY_DETECTOR_SUSPENDED")
              except ClientError as exc:
                  print(f"GuardDuty detector-status check failed: {exc}")
                  findings.append("GUARDDUTY_NOT_ENABLED")

              try:
                  securityhub.describe_hub()
                  metrics["SecurityHubEnabled"] = 1
              except ClientError as exc:
                  print(f"Security Hub not enabled: {exc}")
                  findings.append("SECURITY_HUB_NOT_ENABLED")

              try:
                  status = inspector2.batch_get_account_status().get("accounts", [])
                  resource_state = status[0].get("resourceState", {}) if status else {}
                  if any(rs.get("status") == "ENABLED" for rs in resource_state.values()):
                      metrics["Inspector2Enabled"] = 1
                  else:
                      findings.append("INSPECTOR2_NOT_ENABLED")
              except ClientError as exc:
                  print(f"Inspector2 account-status check failed: {exc}")
                  findings.append("INSPECTOR2_NOT_ENABLED")

              return metrics


          def _check_ebs_and_rds_encryption(ec2, rds, findings):
              """KSI-SVC-SIN, regional half: EBS encryption-by-default (a per-region account setting) and RDS storage encryption."""
              metrics = {"EbsEncryptionByDefaultEnabled": 0, "RdsInstancesUnencrypted": 0}

              try:
                  if ec2.get_ebs_encryption_by_default().get("EbsEncryptionByDefault"):
                      metrics["EbsEncryptionByDefaultEnabled"] = 1
                  else:
                      findings.append("EBS_ENCRYPTION_BY_DEFAULT_DISABLED")
              except ClientError as exc:
                  print(f"EBS encryption-by-default check failed: {exc}")

              try:
                  paginator = rds.get_paginator("describe_db_instances")
                  for page in paginator.paginate():
                      for db in page.get("DBInstances", []):
                          if not db.get("StorageEncrypted", False):
                              metrics["RdsInstancesUnencrypted"] += 1
                              findings.append(f"RDS_STORAGE_UNENCRYPTED instance={db.get('DBInstanceIdentifier')}")
              except ClientError as exc:
                  print(f"RDS storage-encryption check failed: {exc}")

              return metrics


          def _check_s3_account_public_access(s3control, account_id, findings):
              """KSI-SVC-SIN, global half: S3 account-level Block Public Access.

              This setting is account-wide, not per-region, so it runs exactly once,
              not once per region.
              """
              metrics = {"S3AccountBlockPublicAccessEnabled": 0}
              try:
                  config = s3control.get_public_access_block(AccountId=account_id).get(
                      "PublicAccessBlockConfiguration", {}
                  )
                  if all(
                      config.get(key, False)
                      for key in ("BlockPublicAcls", "IgnorePublicAcls", "BlockPublicPolicy", "RestrictPublicBuckets")
                  ):
                      metrics["S3AccountBlockPublicAccessEnabled"] = 1
                  else:
                      findings.append("S3_ACCOUNT_BLOCK_PUBLIC_ACCESS_PARTIAL")
              except ClientError as exc:
                  # NoSuchPublicAccessBlockConfiguration means it was never configured at all.
                  print(f"S3 account-level Block Public Access check failed: {exc}")
                  findings.append("S3_ACCOUNT_BLOCK_PUBLIC_ACCESS_NOT_CONFIGURED")

              return metrics


          def _check_password_policy(iam, findings):
              """KSI-IAM-APM: is a strong IAM account password policy enforced."""
              metrics = {"IamPasswordPolicyCompliant": 0}
              try:
                  policy = iam.get_account_password_policy().get("PasswordPolicy", {})
                  compliant = (
                      policy.get("MinimumPasswordLength", 0) >= 14
                      and policy.get("RequireSymbols", False)
                      and policy.get("RequireNumbers", False)
                      and policy.get("RequireUppercaseCharacters", False)
                      and policy.get("RequireLowercaseCharacters", False)
                      and (policy.get("MaxPasswordAge") or 9999) <= 90
                      and (policy.get("PasswordReusePrevention") or 0) >= 24
                  )
                  if compliant:
                      metrics["IamPasswordPolicyCompliant"] = 1
                  else:
                      findings.append("IAM_PASSWORD_POLICY_WEAK")
              except ClientError as exc:
                  print(f"IAM password policy check failed: {exc}")
                  findings.append("NO_IAM_PASSWORD_POLICY")

              return metrics


          def chunked(items, size):
              for i in range(0, len(items), size):
                  yield items[i:i + size]


          def _enabled_regions(ec2):
              """Every region this account can actually call, not every region that exists.

              AllRegions=False returns only regions with an opt-in-status of
              'opted-in' or 'opt-in-not-required' -- calling a regional API against a
              region the account was never opted into just raises an
              AuthFailure/UnrecognizedClientException, so this avoids that entirely
              rather than catching it 30+ times per run.
              """
              try:
                  regions = ec2.describe_regions(AllRegions=False).get("Regions", [])
                  names = sorted(r["RegionName"] for r in regions)
                  if names:
                      return names
              except ClientError as exc:
                  print(f"describe_regions failed, falling back to this Lambda's own region: {exc}")

              fallback = boto3.session.Session().region_name
              return [fallback] if fallback else ["us-east-1"]


          def _merge_and(current, new_value):
              """True only if every region checked so far reports true -- for 'is X enabled account-wide'."""
              return 1 if (current == 1 and new_value == 1) else 0


          def _merge_or(current, new_value):
              """True if any region reports true -- for 'does at least one trail/resource satisfy this'."""
              return 1 if (current == 1 or new_value == 1) else 0


          def handler(event, context):
              findings = []

              # Global, single-call clients -- these services are account-wide, not
              # per-region, so looping them would just repeat identical work.
              default_ec2 = boto3.client("ec2")
              support = boto3.client("support", region_name="us-east-1")
              s3 = boto3.client("s3")
              s3control = boto3.client("s3control")
              iam = boto3.client("iam")
              sts = boto3.client("sts")

              regions = _enabled_regions(default_ec2)

              # Every regional metric this collector publishes, seeded so the
              # AND-merged booleans start "true" (a region has to actually disprove
              # it) and OR-merged/summed ones start at their natural zero.
              totals = {
                  "ConfigRecorderEnabled": 1,
                  "ConfigRulesCompliant": 0,
                  "ConfigRulesNonCompliant": 0,
                  "CloudTrailMultiRegionEnabled": 0,
                  "CloudTrailLogFileValidationEnabled": 0,
                  "CloudTrailLoggingActive": 0,
                  "BackupPlansCount": 0,
                  "BackupJobsSucceeded24h": 0,
                  "BackupJobsFailed24h": 0,
                  "AccessAnalyzerActive": 1,
                  "AccessAnalyzerExternalAccessFindings": 0,
                  "RdsInstancesNotMultiAz": 0,
                  "AsgSingleAzCount": 0,
                  "ConfigRulesWithRemediation": 0,
                  "ConfigRulesWithoutRemediation": 0,
                  "VpcEndpointsCount": 0,
                  "VpcsWithoutCustomNacl": 0,
                  "AcmCertsExpiringSoon": 0,
                  "SecurityHubControlsPassed": 0,
                  "SecurityHubControlsFailed": 0,
                  "Inspector2CriticalFindings": 0,
                  "Inspector2HighFindings": 0,
                  "Ec2InstancesWithoutInstanceProfile": 0,
                  "GuardDutyEnabled": 1,
                  "SecurityHubEnabled": 1,
                  "Inspector2Enabled": 1,
                  "EbsEncryptionByDefaultEnabled": 1,
                  "RdsInstancesUnencrypted": 0,
              }

              for region in regions:
                  region_findings = []

                  config = boto3.client("config", region_name=region)
                  cloudtrail = boto3.client("cloudtrail", region_name=region)
                  backup = boto3.client("backup", region_name=region)
                  analyzer = boto3.client("accessanalyzer", region_name=region)
                  rds = boto3.client("rds", region_name=region)
                  autoscaling = boto3.client("autoscaling", region_name=region)
                  ec2 = boto3.client("ec2", region_name=region)
                  acm = boto3.client("acm", region_name=region)
                  securityhub = boto3.client("securityhub", region_name=region)
                  inspector2 = boto3.client("inspector2", region_name=region)
                  guardduty = boto3.client("guardduty", region_name=region)

                  non_compliant_rule_names = []

                  cfg = _check_config(config, region_findings, non_compliant_rule_names)
                  totals["ConfigRecorderEnabled"] = _merge_and(totals["ConfigRecorderEnabled"], cfg["ConfigRecorderEnabled"])
                  totals["ConfigRulesCompliant"] += cfg["ConfigRulesCompliant"]
                  totals["ConfigRulesNonCompliant"] += cfg["ConfigRulesNonCompliant"]

                  ct = _check_cloudtrail(cloudtrail, region_findings)
                  totals["CloudTrailMultiRegionEnabled"] = _merge_or(totals["CloudTrailMultiRegionEnabled"], ct["CloudTrailMultiRegionEnabled"])
                  totals["CloudTrailLogFileValidationEnabled"] = _merge_or(totals["CloudTrailLogFileValidationEnabled"], ct["CloudTrailLogFileValidationEnabled"])
                  totals["CloudTrailLoggingActive"] = _merge_or(totals["CloudTrailLoggingActive"], ct["CloudTrailLoggingActive"])

                  bk = _check_backups(backup, region_findings)
                  totals["BackupPlansCount"] += bk["BackupPlansCount"]
                  totals["BackupJobsSucceeded24h"] += bk["BackupJobsSucceeded24h"]
                  totals["BackupJobsFailed24h"] += bk["BackupJobsFailed24h"]

                  aa = _check_access_analyzer(analyzer, region_findings)
                  totals["AccessAnalyzerActive"] = _merge_and(totals["AccessAnalyzerActive"], aa["AccessAnalyzerActive"])
                  totals["AccessAnalyzerExternalAccessFindings"] += aa["AccessAnalyzerExternalAccessFindings"]

                  ha = _check_high_availability(rds, autoscaling, region_findings)
                  totals["RdsInstancesNotMultiAz"] += ha["RdsInstancesNotMultiAz"]
                  totals["AsgSingleAzCount"] += ha["AsgSingleAzCount"]

                  rem = _check_auto_remediation(config, non_compliant_rule_names, region_findings)
                  totals["ConfigRulesWithRemediation"] += rem["ConfigRulesWithRemediation"]
                  totals["ConfigRulesWithoutRemediation"] += rem["ConfigRulesWithoutRemediation"]

                  net = _check_network_segmentation(ec2, region_findings)
                  totals["VpcEndpointsCount"] += net["VpcEndpointsCount"]
                  totals["VpcsWithoutCustomNacl"] += net["VpcsWithoutCustomNacl"]

                  acm_result = _check_acm_certificates(acm, region_findings)
                  totals["AcmCertsExpiringSoon"] += acm_result["AcmCertsExpiringSoon"]

                  sh = _check_security_hub_score(securityhub, region_findings)
                  totals["SecurityHubControlsPassed"] += sh["SecurityHubControlsPassed"]
                  totals["SecurityHubControlsFailed"] += sh["SecurityHubControlsFailed"]

                  insp = _check_inspector_findings(inspector2, region_findings)
                  totals["Inspector2CriticalFindings"] += insp["Inspector2CriticalFindings"]
                  totals["Inspector2HighFindings"] += insp["Inspector2HighFindings"]

                  nua = _check_non_user_auth(ec2, region_findings)
                  totals["Ec2InstancesWithoutInstanceProfile"] += nua["Ec2InstancesWithoutInstanceProfile"]

                  det = _check_detector_status(guardduty, securityhub, inspector2, region_findings)
                  totals["GuardDutyEnabled"] = _merge_and(totals["GuardDutyEnabled"], det["GuardDutyEnabled"])
                  totals["SecurityHubEnabled"] = _merge_and(totals["SecurityHubEnabled"], det["SecurityHubEnabled"])
                  totals["Inspector2Enabled"] = _merge_and(totals["Inspector2Enabled"], det["Inspector2Enabled"])

                  enc = _check_ebs_and_rds_encryption(ec2, rds, region_findings)
                  totals["EbsEncryptionByDefaultEnabled"] = _merge_and(totals["EbsEncryptionByDefaultEnabled"], enc["EbsEncryptionByDefaultEnabled"])
                  totals["RdsInstancesUnencrypted"] += enc["RdsInstancesUnencrypted"]

                  findings.extend(f"region={region} {line}" for line in region_findings)

              # Global checks -- run exactly once, not once per region.
              totals.update(_check_trusted_advisor(support, findings))
              totals.update(_check_password_policy(iam, findings))
              totals.update(_check_s3_secure_transport(s3, findings))

              try:
                  account_id = sts.get_caller_identity()["Account"]
                  totals.update(_check_s3_account_public_access(s3control, account_id, findings))
              except ClientError as exc:
                  print(f"Could not resolve account ID for S3 account-level checks: {exc}")

              # One account-wide Security Hub score computed from the regional sums,
              # not averaged per-region -- a 500-control region should outweigh a
              # 5-control one, not count equally.
              evaluated = totals["SecurityHubControlsPassed"] + totals["SecurityHubControlsFailed"]
              totals["SecurityHubControlsEvaluated"] = evaluated
              totals["SecurityHubStandardsScorePercent"] = (
                  round((totals["SecurityHubControlsPassed"] / evaluated) * 100) if evaluated else 0
              )

              metric_data = [
                  {"MetricName": name, "Value": value, "Unit": "Count"} for name, value in totals.items()
              ]

              cw = boto3.client("cloudwatch")
              for batch in chunked(metric_data, 20):
                  cw.put_metric_data(Namespace=METRIC_NAMESPACE, MetricData=batch)

              for line in findings:
                  print(line)

              return {"metrics_published": len(metric_data), "findings": len(findings)}
  # ---------------------------------------------------------------------
  # Schedule the audit collector
  # ---------------------------------------------------------------------
  AuditCollectorSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${NamePrefix}-collector-schedule"
      Description: Triggers the FedRAMP 20x audit-evidence collector Lambda on a schedule.
      ScheduleExpression: !Ref AuditScanSchedule
      State: ENABLED
      Targets:
        - Id: AuditCollectorTarget
          Arn: !GetAtt AuditCollectorFunction.Arn

  AuditCollectorInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuditCollectorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AuditCollectorSchedule.Arn

Outputs:
  AuditCollectorFunctionName:
    Description: Name of the scheduled audit-evidence collector Lambda
    Value: !Ref AuditCollectorFunction

  AuditCollectorLogGroupName:
    Description: Log group for the collector Lambda (also where flagged resource IDs are printed)
    Value: !Ref AuditCollectorLogGroup
