AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Org-wide agentic AI guardrails dashboard. Deploy this ONCE, in your central
  monitoring account, after every member account has an OAM Link deployed
  (see ../../org-observability/oam-link) sharing AWS::CloudWatch::Metric.
  There is no separate collector stack for this dashboard — Bedrock Agents
  and Bedrock Guardrails already publish their metrics natively in every
  account, so the OAM Link alone is enough to make them visible here.

  Uses a Lambda-backed custom resource for the same reason as the NHI
  governance org-dashboard: CloudFormation can't loop-generate JSON inside a
  DashboardBody string. Count-style metrics (invocations, errors, tokens)
  are summed across accounts with SUM(); latency-style metrics are averaged
  with AVG() — summing averages across accounts would be meaningless.

Parameters:
  DashboardName:
    Type: String
    Default: agentic-ai-guardrails-org-dashboard
    Description: Name of the cross-account CloudWatch dashboard.

  MemberAccountIds:
    Type: CommaDelimitedList
    Description: Every member account ID to include on this dashboard.

  LogRetentionDays:
    Type: Number
    Default: 365
    Description: Retention for the dashboard-generator Lambda's own log group.
    AllowedValues:
      [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]

Resources:
  DashboardGeneratorKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Encrypts the ${DashboardName} generator Lambda's log group"
      EnableKeyRotation: true
      KeyPolicy: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "AllowAccountKeyAdministration",
              "Effect": "Allow",
              "Principal": { "AWS": "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" },
              "Action": "kms:*",
              "Resource": "*"
            },
            {
              "Sid": "AllowCloudWatchLogsToUseKey",
              "Effect": "Allow",
              "Principal": { "Service": "logs.${AWS::Region}.amazonaws.com" },
              "Action": [
                "kms:Encrypt*", "kms:Decrypt*", "kms:ReEncrypt*",
                "kms:GenerateDataKey*", "kms:Describe*"
              ],
              "Resource": "*",
              "Condition": {
                "ArnLike": {
                  "kms:EncryptionContext:aws:logs:arn": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"
                }
              }
            }
          ]
        }

  DashboardGeneratorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${DashboardName}-generator"
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !GetAtt DashboardGeneratorKmsKey.Arn

  DashboardGeneratorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${DashboardName}-generator-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: manage-this-dashboard-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutDashboard
                  - cloudwatch:DeleteDashboard
                  - cloudwatch:GetDashboard
                Resource: !Sub "arn:${AWS::Partition}:cloudwatch::${AWS::AccountId}:dashboard/${DashboardName}"

  DashboardGeneratorFunction:
    Type: AWS::Lambda::Function
    DependsOn: DashboardGeneratorLogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_117
            comment: >-
              CloudFormation custom-resource Lambda that only calls the
              regional CloudWatch control-plane API at deploy time; a VPC
              would add nothing but a NAT gateway bill.
          - id: CKV_AWS_272
            comment: >-
              No AWS Signer code-signing pipeline exists for this account;
              out of scope for a public template repo since the profile ARN
              is account-specific.
    Properties:
      FunctionName: !Sub "${DashboardName}-generator"
      Description: CloudFormation custom-resource handler that builds and applies the org-wide agentic AI guardrails dashboard's DashboardBody.
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt DashboardGeneratorRole.Arn
      KmsKeyArn: !GetAtt DashboardGeneratorKmsKey.Arn
      TracingConfig:
        Mode: Active
      Code:
        ZipFile: |
          import json
          import urllib.request

          import boto3
          from botocore.exceptions import ClientError

          cloudwatch = boto3.client("cloudwatch")

          AGENTS = "AWS/Bedrock/Agents"
          GUARDRAILS = "AWS/Bedrock/Guardrails"


          def send_cfn_response(event, context, status, data=None, physical_resource_id=None, reason=None):
              body = json.dumps({
                  "Status": status,
                  "Reason": reason or f"See CloudWatch Logs: {context.log_stream_name}",
                  "PhysicalResourceId": physical_resource_id or event.get("PhysicalResourceId") or event["LogicalResourceId"],
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "NoEcho": False,
                  "Data": data or {},
              }).encode("utf-8")
              req = urllib.request.Request(
                  event["ResponseURL"], data=body, method="PUT",
                  headers={"Content-Type": "", "Content-Length": str(len(body))},
              )
              urllib.request.urlopen(req)


          # ---------------------------------------------------------------
          # For a SEARCH()-based metric (rather than a simple un-dimensioned
          # one), build one hidden per-account SEARCH expression plus a
          # visible combining expression. combine="SUM" for count-style
          # metrics (invocations, errors, tokens); combine="AVG" for
          # latency/rate-style metrics — summing averages across accounts
          # would be meaningless.
          # ---------------------------------------------------------------
          def combine_search(namespace, dimension, metric_name, account_ids, label,
                              stat="Sum", period=300, combine="SUM", id_prefix="m"):
              entries = []
              ids = []
              for i, acct in enumerate(account_ids):
                  mid = f"{id_prefix}{i}"
                  ids.append(mid)
                  entries.append([{
                      "expression": f"SEARCH('{{{namespace},{dimension}}} MetricName=\"{metric_name}\"', '{stat}', {period})",
                      "id": mid, "accountId": acct, "visible": False,
                  }])
              entries.append([{
                  "expression": f"{combine}([{','.join(ids)}])",
                  "label": label,
                  "id": f"total_{id_prefix}",
              }])
              return entries


          # A dimensioned metric (variable series per account, e.g. broken
          # out by GuardrailPolicyType) doesn't collapse to one number —
          # show one SEARCH per account side by side instead.
          def search_per_account(namespace, dimension, metric_name, account_ids,
                                  stat="Sum", period=300, id_prefix="p"):
              return [
                  [{
                      "expression": f"SEARCH('{{{namespace},{dimension}}} MetricName=\"{metric_name}\"', '{stat}', {period})",
                      "id": f"{id_prefix}{i}", "accountId": acct, "label": acct,
                  }]
                  for i, acct in enumerate(account_ids)
              ]


          def build_dashboard_body(account_ids, region):
              rate_inv = combine_search(GUARDRAILS, "Operation", "Invocations", account_ids, "invocations_total", stat="Sum", period=86400, id_prefix="ri")
              rate_inv[-1][0].update({"visible": False, "id": "rate_invocations"})
              rate_intv = combine_search(GUARDRAILS, "Operation", "InvocationsIntervened", account_ids, "intervened_total", stat="Sum", period=86400, id_prefix="rv")
              rate_intv[-1][0].update({"visible": False, "id": "rate_intervened"})
              rate_metrics = rate_inv + rate_intv + [[{
                  "expression": "100*rate_intervened/rate_invocations",
                  "label": "Intervention Rate (%)", "id": "rate",
              }]]

              widgets = [
                  {"type": "metric", "x": 0, "y": 0, "width": 6, "height": 4, "properties": {
                      "title": "Agent Invocations (org-wide, 24h)", "region": region, "view": "singleValue",
                      "metrics": combine_search(AGENTS, "Operation", "InvocationCount", account_ids, "Invocations", period=86400, id_prefix="ai"),
                  }},
                  {"type": "metric", "x": 6, "y": 0, "width": 6, "height": 4, "properties": {
                      "title": "Guardrail Invocations (org-wide, 24h)", "region": region, "view": "singleValue",
                      "metrics": combine_search(GUARDRAILS, "Operation", "Invocations", account_ids, "Invocations", period=86400, id_prefix="gi"),
                  }},
                  {"type": "metric", "x": 12, "y": 0, "width": 6, "height": 4, "properties": {
                      "title": "Guardrail Interventions (org-wide, 24h)", "region": region, "view": "singleValue",
                      "metrics": combine_search(GUARDRAILS, "Operation", "InvocationsIntervened", account_ids, "Interventions", period=86400, id_prefix="gv"),
                  }},
                  {"type": "metric", "x": 18, "y": 0, "width": 6, "height": 4, "properties": {
                      "title": "Guardrail Intervention Rate (org-wide, 24h)", "region": region, "view": "singleValue",
                      "metrics": rate_metrics,
                  }},
                  {"type": "metric", "x": 0, "y": 4, "width": 12, "height": 6, "properties": {
                      "title": "Agent Invocations, Throttles & Errors (org-wide)", "region": region, "view": "timeSeries",
                      "metrics": (
                          combine_search(AGENTS, "Operation", "InvocationCount", account_ids, "Invocations", id_prefix="ic")
                          + combine_search(AGENTS, "Operation", "InvocationThrottles", account_ids, "Throttles", id_prefix="it")
                          + combine_search(AGENTS, "Operation", "InvocationClientErrors", account_ids, "Client Errors", id_prefix="ie")
                          + combine_search(AGENTS, "Operation", "InvocationServerErrors", account_ids, "Server Errors", id_prefix="is")
                      ),
                  }},
                  {"type": "metric", "x": 12, "y": 4, "width": 12, "height": 6, "properties": {
                      "title": "Agent Latency (org-wide, avg ms)", "region": region, "view": "timeSeries",
                      "metrics": (
                          combine_search(AGENTS, "Operation", "TotalTime", account_ids, "Total Time", stat="Average", combine="AVG", id_prefix="lt")
                          + combine_search(AGENTS, "Operation", "ModelLatency", account_ids, "Model Latency", stat="Average", combine="AVG", id_prefix="lm")
                          + combine_search(AGENTS, "Operation", "TTFT", account_ids, "Time to First Token", stat="Average", combine="AVG", id_prefix="lf")
                      ),
                  }},
                  {"type": "metric", "x": 0, "y": 10, "width": 12, "height": 6, "properties": {
                      "title": "Agent Token Usage (org-wide)", "region": region, "view": "timeSeries",
                      "metrics": (
                          combine_search(AGENTS, "Operation", "InputTokenCount", account_ids, "Input Tokens", id_prefix="ti")
                          + combine_search(AGENTS, "Operation", "OutputTokenCount", account_ids, "Output Tokens", id_prefix="to")
                      ),
                  }},
                  {"type": "metric", "x": 12, "y": 10, "width": 12, "height": 6, "properties": {
                      "title": "Agent \u2192 Model Call Health (org-wide)", "region": region, "view": "timeSeries",
                      "metrics": (
                          combine_search(AGENTS, "Operation", "ModelInvocationCount", account_ids, "Model Invocations", id_prefix="mc")
                          + combine_search(AGENTS, "Operation", "ModelInvocationThrottles", account_ids, "Model Throttles", id_prefix="mt")
                          + combine_search(AGENTS, "Operation", "ModelInvocationClientErrors", account_ids, "Model Client Errors", id_prefix="me")
                          + combine_search(AGENTS, "Operation", "ModelInvocationServerErrors", account_ids, "Model Server Errors", id_prefix="ms")
                      ),
                  }},
                  {"type": "metric", "x": 0, "y": 16, "width": 12, "height": 6, "properties": {
                      "title": "Guardrail Invocations vs Interventions (org-wide)", "region": region, "view": "timeSeries",
                      "metrics": (
                          combine_search(GUARDRAILS, "Operation", "Invocations", account_ids, "Invocations", id_prefix="gi2")
                          + combine_search(GUARDRAILS, "Operation", "InvocationsIntervened", account_ids, "Interventions", id_prefix="gv2")
                      ),
                  }},
                  {"type": "metric", "x": 12, "y": 16, "width": 12, "height": 6, "properties": {
                      "title": "Guardrail Interventions by Policy Category (org-wide)", "region": region, "view": "bar",
                      "metrics": search_per_account(GUARDRAILS, "GuardrailPolicyType", "InvocationsIntervened", account_ids, id_prefix="pc"),
                  }},
                  {"type": "metric", "x": 0, "y": 22, "width": 12, "height": 6, "properties": {
                      "title": "Guardrail Latency & Errors (org-wide)", "region": region, "view": "timeSeries",
                      "metrics": (
                          combine_search(GUARDRAILS, "Operation", "InvocationLatency", account_ids, "Avg Latency", stat="Average", combine="AVG", id_prefix="gl")
                          + combine_search(GUARDRAILS, "Operation", "InvocationClientErrors", account_ids, "Client Errors", id_prefix="ge")
                          + combine_search(GUARDRAILS, "Operation", "InvocationServerErrors", account_ids, "Server Errors", id_prefix="gs")
                          + combine_search(GUARDRAILS, "Operation", "InvocationThrottles", account_ids, "Throttles", id_prefix="gt")
                      ),
                  }},
                  {"type": "metric", "x": 12, "y": 22, "width": 12, "height": 6, "properties": {
                      "title": "Guardrail Text Units Consumed (org-wide)", "region": region, "view": "timeSeries",
                      "metrics": combine_search(GUARDRAILS, "Operation", "TextUnitCount", account_ids, "Text Units", id_prefix="tu"),
                  }},
              ]
              return {"widgets": widgets}


          def handler(event, context):
              request_type = event["RequestType"]
              props = event.get("ResourceProperties", {})
              dashboard_name = props["DashboardName"]

              try:
                  if request_type in ("Create", "Update"):
                      account_ids = props["MemberAccountIds"]
                      if isinstance(account_ids, str):
                          account_ids = [a.strip() for a in account_ids.split(",") if a.strip()]
                      region = props.get("Region") or context.invoked_function_arn.split(":")[3]

                      body = build_dashboard_body(account_ids, region)
                      cloudwatch.put_dashboard(DashboardName=dashboard_name, DashboardBody=json.dumps(body))
                      send_cfn_response(event, context, "SUCCESS", physical_resource_id=dashboard_name)

                  elif request_type == "Delete":
                      physical_id = event.get("PhysicalResourceId", dashboard_name)
                      try:
                          cloudwatch.delete_dashboard(DashboardNames=[physical_id])
                      except ClientError as exc:
                          if exc.response["Error"]["Code"] not in ("ResourceNotFound", "ResourceNotFoundException"):
                              raise
                      send_cfn_response(event, context, "SUCCESS", physical_resource_id=physical_id)

                  else:
                      send_cfn_response(event, context, "SUCCESS", physical_resource_id=dashboard_name)

              except Exception as exc:
                  print(f"ERROR: {exc}")
                  send_cfn_response(event, context, "FAILED", reason=str(exc),
                                     physical_resource_id=event.get("PhysicalResourceId", dashboard_name))

  OrgDashboard:
    Type: Custom::AgenticAiGuardrailsOrgDashboard
    Properties:
      ServiceToken: !GetAtt DashboardGeneratorFunction.Arn
      DashboardName: !Ref DashboardName
      MemberAccountIds: !Join [",", !Ref MemberAccountIds]
      Region: !Ref "AWS::Region"

Outputs:
  DashboardUrl:
    Description: Console URL to open the cross-account dashboard directly
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${DashboardName}"
