AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Bedrock usage and cost observability dashboard. Reads native AWS/Bedrock
  CloudWatch metrics (invocations, tokens, latency, errors, throttles) across
  every model in the account via metric search expressions, and adds a daily
  Cost Explorer collector that publishes estimated Bedrock cost by usage type
  as a custom CloudWatch metric. Unlike the security-posture-dashboard, this
  one needs no EventBridge-to-Logs pipeline for the usage metrics — Bedrock
  already publishes them to CloudWatch. Works in AWS commercial and AWS
  GovCloud (Cost Explorer's underlying billing data works the same way in
  GovCloud, but confirm CE is enabled for your account/payer before relying
  on the cost widgets).

Parameters:
  NamePrefix:
    Type: String
    Default: bedrock-observability
    Description: Prefix applied to all resource names created by this stack.
    AllowedPattern: "^[a-z0-9-]{1,40}$"

  LogRetentionInDays:
    Type: Number
    Default: 365
    Description: >-
      Retention period for the cost-collector Lambda's log group. Defaults to
      365 to satisfy Checkov CKV_AWS_338 (retain at least 1 year).
    AllowedValues:
      [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]

  MetricNamespace:
    Type: String
    Default: BedrockCostObservability
    Description: CloudWatch custom metric namespace the cost-collector Lambda publishes into.

  CostCollectionSchedule:
    Type: String
    Default: rate(1 day)
    Description: >-
      EventBridge schedule expression for the cost-collector Lambda. Cost
      Explorer data typically lags 24-48h, so more frequent runs won't get you
      fresher numbers — daily is the practical ceiling.

Resources:
  # ---------------------------------------------------------------------
  # KMS key used to encrypt the cost-collector's log group, env vars, and DLQ
  # ---------------------------------------------------------------------
  ObservabilityKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Encrypts cost-collector resources for the ${NamePrefix} dashboard"
      EnableKeyRotation: true
      KeyPolicy: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "AllowAccountKeyAdministration",
              "Effect": "Allow",
              "Principal": { "AWS": "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" },
              "Action": "kms:*",
              "Resource": "*"
            },
            {
              "Sid": "AllowCloudWatchLogsToUseKey",
              "Effect": "Allow",
              "Principal": { "Service": "logs.${AWS::Region}.amazonaws.com" },
              "Action": [
                "kms:Encrypt*",
                "kms:Decrypt*",
                "kms:ReEncrypt*",
                "kms:GenerateDataKey*",
                "kms:Describe*"
              ],
              "Resource": "*",
              "Condition": {
                "ArnLike": {
                  "kms:EncryptionContext:aws:logs:arn": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"
                }
              }
            },
            {
              "Sid": "AllowLambdaAndSqsServices",
              "Effect": "Allow",
              "Principal": {
                "Service": ["lambda.amazonaws.com", "sqs.amazonaws.com"]
              },
              "Action": [
                "kms:Encrypt*",
                "kms:Decrypt*",
                "kms:ReEncrypt*",
                "kms:GenerateDataKey*",
                "kms:Describe*"
              ],
              "Resource": "*"
            }
          ]
        }

  ObservabilityKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${NamePrefix}-observability"
      TargetKeyId: !Ref ObservabilityKmsKey

  # ---------------------------------------------------------------------
  # Dead-letter queue for the cost-collector Lambda
  # ---------------------------------------------------------------------
  CostCollectorDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${NamePrefix}-cost-collector-dlq"
      MessageRetentionPeriod: 1209600 # 14 days
      KmsMasterKeyId: !Ref ObservabilityKmsKey

  # ---------------------------------------------------------------------
  # Log group for the cost-collector Lambda (declared explicitly so it's
  # encrypted and has an explicit retention before Lambda would otherwise
  # auto-create an unmanaged one)
  # ---------------------------------------------------------------------
  CostCollectorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NamePrefix}-cost-collector"
      RetentionInDays: !Ref LogRetentionInDays
      KmsKeyId: !GetAtt ObservabilityKmsKey.Arn

  # ---------------------------------------------------------------------
  # IAM role for the cost-collector Lambda
  # ---------------------------------------------------------------------
  CostCollectorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${NamePrefix}-cost-collector-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: cost-explorer-read-and-metric-publish
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadCostExplorer
                Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                Resource: "*" # Cost Explorer does not support resource-level permissions
              - Sid: PublishCustomMetrics
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*" # PutMetricData does not support resource-level permissions
                Condition:
                  StringEquals:
                    cloudwatch:namespace: !Ref MetricNamespace
              - Sid: SendToDlq
                Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt CostCollectorDlq.Arn

  # ---------------------------------------------------------------------
  # Cost-collector Lambda: pulls yesterday's Bedrock cost by usage type from
  # Cost Explorer and republishes it as a CloudWatch custom metric so it can
  # sit on the same dashboard as the native Bedrock usage metrics.
  # ---------------------------------------------------------------------
  CostCollectorFunction:
    Type: AWS::Lambda::Function
    DependsOn: CostCollectorLogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_117
            comment: >-
              Cost Explorer has no VPC endpoint/PrivateLink support, so
              placing this function in a VPC would require a NAT gateway with
              no security benefit for a read-only, scheduled cost lookup.
    Properties:
      FunctionName: !Sub "${NamePrefix}-cost-collector"
      Description: Publishes yesterday's Bedrock cost-by-usage-type from Cost Explorer as a CloudWatch metric.
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt CostCollectorRole.Arn
      Timeout: 30
      MemorySize: 128
      ReservedConcurrentExecutions: 1
      KmsKeyArn: !GetAtt ObservabilityKmsKey.Arn
      DeadLetterConfig:
        TargetArn: !GetAtt CostCollectorDlq.Arn
      Environment:
        Variables:
          METRIC_NAMESPACE: !Ref MetricNamespace
      Code:
        ZipFile: |
          import os
          import datetime
          import boto3

          METRIC_NAMESPACE = os.environ.get("METRIC_NAMESPACE", "BedrockCostObservability")


          def handler(event, context):
              # Cost Explorer is only ever queried via its us-east-1 endpoint,
              # regardless of which region this function runs in.
              ce = boto3.client("ce", region_name="us-east-1")
              cw = boto3.client("cloudwatch")

              end = datetime.date.today()
              start = end - datetime.timedelta(days=1)

              response = ce.get_cost_and_usage(
                  TimePeriod={"Start": start.isoformat(), "End": end.isoformat()},
                  Granularity="DAILY",
                  Metrics=["UnblendedCost"],
                  Filter={"Dimensions": {"Key": "SERVICE", "Values": ["Amazon Bedrock"]}},
                  GroupBy=[{"Type": "DIMENSION", "Key": "USAGE_TYPE"}],
              )

              metric_data = []
              total = 0.0
              for result in response.get("ResultsByTime", []):
                  for group in result.get("Groups", []):
                      usage_type = group["Keys"][0]
                      amount = float(group["Metrics"]["UnblendedCost"]["Amount"])
                      total += amount
                      metric_data.append({
                          "MetricName": "EstimatedDailyCostUSD",
                          "Dimensions": [{"Name": "UsageType", "Value": usage_type}],
                          "Value": amount,
                          "Unit": "None",
                      })

              metric_data.append({
                  "MetricName": "EstimatedDailyCostUSD",
                  "Dimensions": [{"Name": "UsageType", "Value": "TOTAL"}],
                  "Value": total,
                  "Unit": "None",
              })

              if metric_data:
                  # put_metric_data accepts up to 1000 metrics per call; a
                  # single day of Bedrock usage types is well under that.
                  cw.put_metric_data(Namespace=METRIC_NAMESPACE, MetricData=metric_data)

              return {"published_metrics": len(metric_data), "total_cost_usd": total}

  # ---------------------------------------------------------------------
  # Schedule the cost collector
  # ---------------------------------------------------------------------
  CostCollectorSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${NamePrefix}-cost-collector-schedule"
      Description: Triggers the Bedrock cost-collector Lambda on a schedule.
      ScheduleExpression: !Ref CostCollectionSchedule
      State: ENABLED
      Targets:
        - Id: CostCollectorTarget
          Arn: !GetAtt CostCollectorFunction.Arn

  CostCollectorInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CostCollectorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CostCollectorSchedule.Arn

  # ---------------------------------------------------------------------
  # Dashboard
  # ---------------------------------------------------------------------
  BedrockUsageCostDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${NamePrefix}-dashboard"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Bedrock Invocations by Model",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": true,
                "metrics": [
                  [ { "expression": "SEARCH('{AWS/Bedrock,ModelId} MetricName=\"Invocations\"', 'Sum', 300)", "label": "Invocations", "id": "e1" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Bedrock Token Volume (Input vs Output)",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "metrics": [
                  [ { "expression": "SEARCH('{AWS/Bedrock,ModelId} MetricName=\"InputTokenCount\"', 'Sum', 300)", "label": "Input Tokens", "id": "e1" } ],
                  [ { "expression": "SEARCH('{AWS/Bedrock,ModelId} MetricName=\"OutputTokenCount\"', 'Sum', 300)", "label": "Output Tokens", "id": "e2" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Bedrock Invocation Latency (avg, ms)",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "metrics": [
                  [ { "expression": "SEARCH('{AWS/Bedrock,ModelId} MetricName=\"InvocationLatency\"', 'Average', 300)", "label": "Avg Latency", "id": "e1" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Bedrock Errors & Throttles",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "metrics": [
                  [ { "expression": "SEARCH('{AWS/Bedrock,ModelId} MetricName=\"InvocationClientErrors\"', 'Sum', 300)", "label": "Client Errors", "id": "e1" } ],
                  [ { "expression": "SEARCH('{AWS/Bedrock,ModelId} MetricName=\"InvocationServerErrors\"', 'Sum', 300)", "label": "Server Errors", "id": "e2" } ],
                  [ { "expression": "SEARCH('{AWS/Bedrock,ModelId} MetricName=\"InvocationThrottles\"', 'Sum', 300)", "label": "Throttles", "id": "e3" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 12, "width": 18, "height": 6,
              "properties": {
                "title": "Estimated Daily Cost by Usage Type",
                "region": "${AWS::Region}",
                "view": "bar",
                "metrics": [
                  [ { "expression": "SEARCH('{${MetricNamespace},UsageType} MetricName=\"EstimatedDailyCostUSD\"', 'Maximum', 86400)", "label": "Cost", "id": "e1" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 18, "y": 12, "width": 6, "height": 6,
              "properties": {
                "title": "Estimated Total Daily Cost (USD)",
                "region": "${AWS::Region}",
                "view": "singleValue",
                "metrics": [
                  [ "${MetricNamespace}", "EstimatedDailyCostUSD", "UsageType", "TOTAL", { "stat": "Maximum", "period": 86400 } ]
                ]
              }
            }
          ]
        }

Outputs:
  DashboardName:
    Description: Name of the created CloudWatch dashboard
    Value: !Ref BedrockUsageCostDashboard

  DashboardUrl:
    Description: Console URL to open the dashboard directly
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${NamePrefix}-dashboard"

  CostCollectorFunctionName:
    Description: Name of the scheduled Bedrock cost-collector Lambda
    Value: !Ref CostCollectorFunction

  CostCollectorLogGroupName:
    Description: Log group for the cost-collector Lambda
    Value: !Ref CostCollectorLogGroup
