AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Org-wide Bedrock usage and cost dashboard. Deploy this ONCE, in your central
  monitoring account (the one holding the OAM sink, see
  ../../org-observability/oam-sink), after every member account has an OAM
  Link (../../org-observability/oam-link) and the cost collector
  (collector.yaml in this folder) deployed via StackSets. Native AWS/Bedrock
  usage metrics need no collector, only the OAM Link; only the cost widgets
  depend on the collector.

  Uses a Lambda-backed custom resource because CloudFormation can't
  loop-generate JSON inside a DashboardBody string. Count-style metrics are
  summed across accounts with SUM(); latency is averaged with AVG(), since
  summing averages across accounts would be meaningless. The Terraform
  version does this natively with `for` expressions.

Parameters:
  DashboardName:
    Type: String
    Default: bedrock-usage-cost-org-dashboard
    Description: Name of the cross-account CloudWatch dashboard.

  MemberAccountIds:
    Type: CommaDelimitedList
    Description: >-
      Every member account ID whose Bedrock usage and cost-collector metrics
      should appear on this dashboard (the same accounts you deployed
      collector.yaml and the OAM Link to). Does not need to include the
      monitoring account itself unless it also runs its own collector.

  MetricNamespace:
    Type: String
    Default: BedrockCostObservability
    Description: Must match the MetricNamespace parameter used when deploying collector.yaml in every member account.

  LogRetentionDays:
    Type: Number
    Default: 365
    Description: Retention for the dashboard-generator Lambda's own log group.
    AllowedValues:
      [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]

Resources:
  # ---------------------------------------------------------------------
  # KMS key encrypting the generator Lambda's log group
  # ---------------------------------------------------------------------
  DashboardGeneratorKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Encrypts the ${DashboardName} generator Lambda's log group"
      EnableKeyRotation: true
      KeyPolicy: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "AllowAccountKeyAdministration",
              "Effect": "Allow",
              "Principal": { "AWS": "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" },
              "Action": "kms:*",
              "Resource": "*"
            },
            {
              "Sid": "AllowCloudWatchLogsToUseKey",
              "Effect": "Allow",
              "Principal": { "Service": "logs.${AWS::Region}.amazonaws.com" },
              "Action": [
                "kms:Encrypt*", "kms:Decrypt*", "kms:ReEncrypt*",
                "kms:GenerateDataKey*", "kms:Describe*"
              ],
              "Resource": "*",
              "Condition": {
                "ArnLike": {
                  "kms:EncryptionContext:aws:logs:arn": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"
                }
              }
            },
            {
              "Sid": "AllowLambdaAndSqsServices",
              "Effect": "Allow",
              "Principal": {
                "Service": ["lambda.amazonaws.com", "sqs.amazonaws.com"]
              },
              "Action": [
                "kms:Encrypt*", "kms:Decrypt*", "kms:ReEncrypt*",
                "kms:GenerateDataKey*", "kms:Describe*"
              ],
              "Resource": "*"
            }
          ]
        }

  DashboardGeneratorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${DashboardName}-generator"
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !GetAtt DashboardGeneratorKmsKey.Arn

  DashboardGeneratorDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${DashboardName}-generator-dlq"
      MessageRetentionPeriod: 1209600 # 14 days
      KmsMasterKeyId: !Ref DashboardGeneratorKmsKey

  # ---------------------------------------------------------------------
  # Least-privilege role: can only manage this one dashboard
  # ---------------------------------------------------------------------
  DashboardGeneratorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${DashboardName}-generator-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: manage-this-dashboard-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutDashboard
                  - cloudwatch:DeleteDashboards
                  - cloudwatch:GetDashboard
                Resource: !Sub "arn:${AWS::Partition}:cloudwatch::${AWS::AccountId}:dashboard/${DashboardName}"
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt DashboardGeneratorDlq.Arn

  # ---------------------------------------------------------------------
  # Generator Lambda — renders and applies the DashboardBody at deploy time
  # ---------------------------------------------------------------------
  DashboardGeneratorFunction:
    Type: AWS::Lambda::Function
    DependsOn: DashboardGeneratorLogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_117
            comment: >-
              CloudFormation custom-resource Lambda that only calls the
              regional CloudWatch control-plane API at deploy time; a VPC
              would add nothing but a NAT gateway bill.
          - id: CKV_AWS_272
            comment: >-
              No AWS Signer code-signing pipeline exists for this account;
              out of scope for a public template repo since the profile ARN
              is account-specific.
    Properties:
      FunctionName: !Sub "${DashboardName}-generator"
      Description: CloudFormation custom-resource handler that builds and applies the org-wide Bedrock usage and cost dashboard's DashboardBody.
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt DashboardGeneratorRole.Arn
      ReservedConcurrentExecutions: 1
      KmsKeyArn: !GetAtt DashboardGeneratorKmsKey.Arn
      DeadLetterConfig:
        TargetArn: !GetAtt DashboardGeneratorDlq.Arn
      TracingConfig:
        Mode: Active
      Code:
        ZipFile: |
          import json
          import urllib.request

          import boto3
          from botocore.exceptions import ClientError

          cloudwatch = boto3.client("cloudwatch")

          BEDROCK = "AWS/Bedrock"


          def send_cfn_response(event, context, status, data=None, physical_resource_id=None, reason=None):
              body = json.dumps({
                  "Status": status,
                  "Reason": reason or f"See CloudWatch Logs: {context.log_stream_name}",
                  "PhysicalResourceId": physical_resource_id or event.get("PhysicalResourceId") or event["LogicalResourceId"],
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "NoEcho": False,
                  "Data": data or {},
              }).encode("utf-8")
              req = urllib.request.Request(
                  event["ResponseURL"], data=body, method="PUT",
                  headers={"Content-Type": "", "Content-Length": str(len(body))},
              )
              urllib.request.urlopen(req)


          # ---------------------------------------------------------------
          # Every metric-math ID is built as "<id_prefix>_<index>" and every
          # id_prefix used below is distinct (and free of underscores and
          # digits), so IDs stay unique within a widget even when the widget
          # combines several groups (e.g. input vs output tokens).
          # ---------------------------------------------------------------

          # Native AWS/Bedrock metrics are dimensioned (ModelId), so build
          # one hidden per-account SEARCH expression plus a visible
          # combining expression. combine="SUM" for count-style metrics
          # (invocations, tokens, errors, throttles); combine="AVG" for
          # latency — summing averages across accounts would be meaningless.
          def combine_search(metric_name, account_ids, label, stat="Sum", period=300, combine="SUM", id_prefix="m"):
              entries = []
              ids = []
              for i, acct in enumerate(account_ids):
                  mid = f"{id_prefix}_{i}"
                  ids.append(mid)
                  entries.append([{
                      "expression": f"SEARCH('{{{BEDROCK},ModelId}} MetricName=\"{metric_name}\"', '{stat}', {period})",
                      "id": mid, "accountId": acct, "visible": False,
                  }])
              entries.append([{
                  "expression": f"{combine}([{','.join(ids)}])",
                  "label": label,
                  "id": f"total_{id_prefix}",
              }])
              return entries


          # The collector's cost metric with a fixed dimension value: build
          # one hidden per-account metric entry (each carrying its own
          # "accountId") plus one visible SUM() across all of them.
          def sum_across_accounts(namespace, metric_name, dimension_name, dimension_value, account_ids, label,
                                  stat="Maximum", period=86400, id_prefix="m"):
              entries = []
              ids = []
              for i, acct in enumerate(account_ids):
                  mid = f"{id_prefix}_{i}"
                  ids.append(mid)
                  entries.append([namespace, metric_name, dimension_name, dimension_value, {
                      "stat": stat, "period": period, "accountId": acct,
                      "id": mid, "visible": False,
                  }])
              entries.append([{
                  "expression": f"SUM([{','.join(ids)}])",
                  "label": label,
                  "id": f"total_{id_prefix}",
              }])
              return entries


          # A dimensioned metric with a variable set of series per account
          # (one per ModelId / UsageType) doesn't collapse to one number —
          # show one SEARCH per account side by side, labelled with the
          # account ID and the dimension value.
          def search_per_account(namespace, dimension, metric_name, account_ids,
                                 stat="Sum", period=300, id_prefix="p"):
              return [
                  [{
                      "expression": f"SEARCH('{{{namespace},{dimension}}} MetricName=\"{metric_name}\"', '{stat}', {period})",
                      "id": f"{id_prefix}_{i}", "accountId": acct,
                      "label": acct + " - ${PROP('Dim." + dimension + "')}",
                  }]
                  for i, acct in enumerate(account_ids)
              ]


          # Cost attribution per account: each account's own TOTAL series
          # side by side (the main org use case for this dashboard).
          def cost_per_account(namespace, account_ids, id_prefix="cacct"):
              return [
                  [namespace, "EstimatedDailyCostUSD", "UsageType", "TOTAL", {
                      "stat": "Maximum", "period": 86400, "accountId": acct,
                      "id": f"{id_prefix}_{i}", "label": acct,
                  }]
                  for i, acct in enumerate(account_ids)
              ]


          def build_dashboard_body(namespace, account_ids, region):
              widgets = [
                  {"type": "metric", "x": 0, "y": 0, "width": 12, "height": 6, "properties": {
                      "title": "Bedrock Invocations (org-wide)", "region": region, "view": "timeSeries",
                      "metrics": combine_search("Invocations", account_ids, "Invocations", id_prefix="inv"),
                  }},
                  {"type": "metric", "x": 12, "y": 0, "width": 12, "height": 6, "properties": {
                      "title": "Bedrock Invocations by Model and Account", "region": region, "view": "timeSeries",
                      "stacked": True,
                      "metrics": search_per_account(BEDROCK, "ModelId", "Invocations", account_ids, id_prefix="invm"),
                  }},
                  {"type": "metric", "x": 0, "y": 6, "width": 12, "height": 6, "properties": {
                      "title": "Bedrock Token Volume (Input vs Output, org-wide)", "region": region, "view": "timeSeries",
                      "metrics": (
                          combine_search("InputTokenCount", account_ids, "Input Tokens", id_prefix="tin")
                          + combine_search("OutputTokenCount", account_ids, "Output Tokens", id_prefix="tout")
                      ),
                  }},
                  {"type": "metric", "x": 12, "y": 6, "width": 12, "height": 6, "properties": {
                      "title": "Bedrock Invocation Latency (org-wide, avg ms)", "region": region, "view": "timeSeries",
                      "metrics": combine_search("InvocationLatency", account_ids, "Avg Latency", stat="Average", combine="AVG", id_prefix="lat"),
                  }},
                  {"type": "metric", "x": 0, "y": 12, "width": 12, "height": 6, "properties": {
                      "title": "Bedrock Errors & Throttles (org-wide)", "region": region, "view": "timeSeries",
                      "metrics": (
                          combine_search("InvocationClientErrors", account_ids, "Client Errors", id_prefix="cerr")
                          + combine_search("InvocationServerErrors", account_ids, "Server Errors", id_prefix="serr")
                          + combine_search("InvocationThrottles", account_ids, "Throttles", id_prefix="thr")
                      ),
                  }},
                  {"type": "metric", "x": 12, "y": 12, "width": 12, "height": 6, "properties": {
                      "title": "Estimated Total Daily Cost (org-wide, USD)", "region": region, "view": "singleValue",
                      "metrics": sum_across_accounts(namespace, "EstimatedDailyCostUSD", "UsageType", "TOTAL", account_ids,
                                                     "Estimated Total Daily Cost (org-wide, USD)", id_prefix="ctot"),
                  }},
                  {"type": "metric", "x": 0, "y": 18, "width": 12, "height": 6, "properties": {
                      "title": "Estimated Daily Cost by Usage Type and Account", "region": region, "view": "bar",
                      "metrics": search_per_account(namespace, "UsageType", "EstimatedDailyCostUSD", account_ids,
                                                    stat="Maximum", period=86400, id_prefix="cuse"),
                  }},
                  {"type": "metric", "x": 12, "y": 18, "width": 12, "height": 6, "properties": {
                      "title": "Estimated Daily Cost per Account (USD)", "region": region, "view": "bar",
                      "metrics": cost_per_account(namespace, account_ids),
                  }},
              ]
              return {"widgets": widgets}


          def handler(event, context):
              request_type = event["RequestType"]
              props = event.get("ResourceProperties", {})
              dashboard_name = props["DashboardName"]

              try:
                  if request_type in ("Create", "Update"):
                      namespace = props.get("MetricNamespace", "BedrockCostObservability")
                      account_ids = props["MemberAccountIds"]
                      if isinstance(account_ids, str):
                          account_ids = [a.strip() for a in account_ids.split(",") if a.strip()]
                      region = props.get("Region") or context.invoked_function_arn.split(":")[3]

                      body = build_dashboard_body(namespace, account_ids, region)
                      cloudwatch.put_dashboard(DashboardName=dashboard_name, DashboardBody=json.dumps(body))
                      send_cfn_response(event, context, "SUCCESS", physical_resource_id=dashboard_name)

                  elif request_type == "Delete":
                      physical_id = event.get("PhysicalResourceId", dashboard_name)
                      try:
                          cloudwatch.delete_dashboards(DashboardNames=[physical_id])
                      except ClientError as exc:
                          if exc.response["Error"]["Code"] not in ("ResourceNotFound", "ResourceNotFoundException"):
                              raise
                      send_cfn_response(event, context, "SUCCESS", physical_resource_id=physical_id)

                  else:
                      send_cfn_response(event, context, "SUCCESS", physical_resource_id=dashboard_name)

              except Exception as exc:
                  print(f"ERROR: {exc}")
                  send_cfn_response(event, context, "FAILED", reason=str(exc),
                                     physical_resource_id=event.get("PhysicalResourceId", dashboard_name))

  # ---------------------------------------------------------------------
  # The custom resource that actually triggers the Lambda above
  # ---------------------------------------------------------------------
  OrgDashboard:
    Type: Custom::BedrockUsageCostOrgDashboard
    Properties:
      ServiceToken: !GetAtt DashboardGeneratorFunction.Arn
      DashboardName: !Ref DashboardName
      MemberAccountIds: !Join [",", !Ref MemberAccountIds]
      MetricNamespace: !Ref MetricNamespace
      Region: !Ref "AWS::Region"

Outputs:
  DashboardUrl:
    Description: Console URL to open the cross-account dashboard directly
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${DashboardName}"
